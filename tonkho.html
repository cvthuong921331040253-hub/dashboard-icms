<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kho vật tư</title>

<!-- Thư viện tạo Excel trực tiếp từ dữ liệu đang có trên giao diện -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fa;
  color:#263238;
}

/* ===== LOADING ===== */
#pageLoader{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:14px;
  background:rgba(243,246,250,.78);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
  transition:opacity .35s ease, visibility .35s ease;
}

#pageLoader.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loader-spinner{
  width:46px;
  height:46px;
  border:4px solid #dbe5f0;
  border-top-color:#1976d2;
  border-right-color:#42a5f5;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

.loader-text{
  color:#546e7a;
  font-size:13px;
  font-weight:600;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

/* ===== HEADER ===== */
.sticky-top{
  position:sticky;
  top:0;
  z-index:999;
  background:rgba(243,246,250,.96);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  padding:10px;
}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

h2{
  margin:0;
  font-size:21px;
  color:#263238;
  letter-spacing:.2px;
}

.update-time{
  color:#78909c;
  margin:4px 0 9px;
  font-size:11px;
}

/* ===== BUTTON ===== */
button{
  border:none;
  background:#1976d2;
  color:white;
  border-radius:7px;
  cursor:pointer;
  transition:.18s ease;
}

button:hover{
  filter:brightness(.96);
  transform:translateY(-1px);
}

.excel-btn{
  min-height:34px;
  padding:0 13px;
  background:#2e7d32;
  font-size:12px;
  font-weight:600;
  box-shadow:0 2px 5px rgba(46,125,50,.18);
}

/* ===== STATS ===== */
.mini-stats{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.mini-stat{
  flex:1;
  background:white;
  border:1px solid #e5ebf1;
  border-radius:10px;
  padding:9px 12px;
  box-shadow:0 2px 8px rgba(31,45,61,.06);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.mini-stat span{
  font-size:12px;
  color:#607d8b;
}

.mini-stat b{
  font-size:16px;
  color:#263238;
}

/* ===== FILTER CARD ===== */
.card{
  background:white;
  border:1px solid #e5ebf1;
  border-radius:11px;
  padding:10px;
  margin-bottom:10px;
  box-shadow:0 2px 8px rgba(31,45,61,.06);
}

.topbar{
  display:grid;
  grid-template-columns:1.3fr 1.1fr 1fr 1.15fr;
  gap:8px;
}

input,select{
  width:100%;
  min-height:36px;
  padding:8px 10px;
  border:1px solid #d5dee7;
  border-radius:7px;
  background:#fff;
  color:#37474f;
  outline:none;
  transition:border-color .18s, box-shadow .18s;
}

input::placeholder{
  color:#90a4ae;
}

input:focus,select:focus{
  border-color:#64b5f6;
  box-shadow:0 0 0 3px rgba(33,150,243,.10);
}


/* ===== BOT TRA CỨU ===== */
.bot-card{
  background:white;
  border:1px solid #dfe7ee;
  border-radius:11px;
  padding:10px;
  margin-bottom:10px;
  box-shadow:0 2px 8px rgba(31,45,61,.06);
}

.bot-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:7px;
}

.bot-title strong{
  font-size:14px;
  color:#263238;
}

.bot-title span{
  font-size:11px;
  color:#78909c;
}

.bot-input-row{
  display:flex;
  gap:7px;
}

#botInput{
  flex:1;
  min-width:0;
}

.bot-send{
  min-width:70px;
  padding:0 12px;
  font-size:12px;
  font-weight:600;
}

.bot-result{
  margin-top:8px;
  padding:9px 10px;
  border-radius:8px;
  background:#f5f9fd;
  border:1px solid #e1ebf3;
  font-size:12px;
  line-height:1.45;
  color:#455a64;
  max-height:260px;
  overflow:auto;
}

.bot-result:empty{
  display:none;
}

.bot-result b{
  color:#263238;
}

.bot-help{
  margin-top:7px;
  color:#607d8b;
  font-size:11px;
  line-height:1.45;
}

.bot-result table{
  width:100%;
  min-width:0;
  border-collapse:collapse;
  margin-top:7px;
  background:white;
}

.bot-result th,
.bot-result td{
  font-size:11px;
  padding:5px 6px;
  border:1px solid #dfe7ee;
  white-space:normal;
}

.bot-result th{
  background:#1976d2;
  color:white;
  position:static;
}

@media(max-width:768px){
  .bot-title span{
    display:none;
  }

  .bot-send{
    min-width:62px;
  }

  .bot-result{
    max-height:300px;
  }
}

/* ===== TABLE ===== */
.table-wrap{
  height:calc(100vh - 180px);
  min-height:300px;
  overflow:auto;
  background:white;
  border:1px solid #d6e0e8;
  border-radius:11px;
  box-shadow:0 2px 9px rgba(31,45,61,.07);
  overflow:auto;
}

table{
  width:auto;
  min-width:100%;
  border-collapse:separate;
  border-spacing:0;
  table-layout:auto;
}

thead th{
  background:#1976d2;
  color:white;
  position:sticky;
  top:0;
  z-index:10;
  font-weight:600;
  box-shadow:0 1px 0 rgba(0,0,0,.08);
}

th,td{
  padding:8px 10px;
  border-right:1px solid #e2e8ee;
  border-bottom:1px solid #e5ebf0;
  font-size:13px;
  vertical-align:middle;
  text-align:left;
}

thead th:first-child{
  border-top-left-radius:10px;
}

tbody tr:nth-child(even){
  background:#f7faff;
}

tbody tr:nth-child(odd){
  background:#fff;
}

tbody tr:hover{
  background:#eaf3ff;
}

tbody tr:active{
  background:#dbeaff;
}

th:not(:first-child),
td:not(:first-child){
  white-space:nowrap;
}

/* Cột mặt hàng cố định */
thead th:first-child{
  left:0;
  z-index:20;
  min-width:145px;
  max-width:240px;
  white-space:normal;
  word-break:break-word;
  line-height:1.25;
}

tbody td:first-child{
  position:sticky;
  left:0;
  z-index:5;
  min-width:145px;
  max-width:240px;
  white-space:normal;
  word-break:break-word;
  line-height:1.3;
  font-weight:600;
}

/* Nền của cột sticky phải theo từng dòng */
tbody tr:nth-child(even) td:first-child{
  background:#f7faff;
}

tbody tr:nth-child(odd) td:first-child{
  background:#fff;
}

tbody tr:hover td:first-child{
  background:#eaf3ff;
}

td.sl-cell{
  text-align:right;
  font-weight:700;
}

.loading{
  padding:30px !important;
  text-align:center !important;
  color:#78909c;
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){

  .sticky-top{
    padding:6px;
  }

  h2{
    font-size:19px;
  }

  .excel-btn{
    min-height:32px;
    padding:0 10px;
    font-size:11px;
  }

  .mini-stats{
    gap:6px;
  }

  .mini-stat{
    padding:8px 10px;
  }

  .mini-stat span{
    font-size:11px;
  }

  .mini-stat b{
    font-size:15px;
  }

  .topbar{
    grid-template-columns:1fr 1fr;
    gap:6px;
  }

  input,select{
    min-height:34px;
    font-size:12px;
  }

  table{
    min-width:100%;
  }

  th,td{
    font-size:12px;
    padding:6px;
  }

  thead th:first-child,
  tbody td:first-child{
    min-width:105px;
    max-width:105px;
  }

  th:nth-child(2),
  td:nth-child(2){
    min-width:42px;
  }

  th:nth-child(3),
  td:nth-child(3){
    min-width:38px;
  }

  th:nth-child(4),
  td:nth-child(4){
    min-width:105px;
    max-width:125px;
    white-space:normal;
    word-break:break-word;
    line-height:1.2;
  }

  th:nth-child(5),
  td:nth-child(5){
    min-width:55px;
    max-width:70px;
    white-space:normal;
    word-break:break-word;
    line-height:1.2;
  }

  .table-wrap{
    height:calc(100vh - 205px);
  }
}
</style>
</head>

<body>

<!-- Màn hình loading -->
<div id="pageLoader">
  <div class="loader-spinner"></div>
  <div class="loader-text">Đang tải dữ liệu kho...</div>
</div>

<div class="sticky-top">

  <div class="header-row">
    <h2>📦 KHO VẬT TƯ</h2>

    <button
      class="excel-btn"
      onclick="downloadExcel()">
      Tải file Excel
    </button>
  </div>

  <div class="update-time">
    Cập nhật: <span id="lastUpdate">--</span>
  </div>


  <div class="bot-card">

    <div class="bot-title">
      <strong>🤖 Bot tra cứu kho</strong>
      <span>Nhập /help để xem lệnh</span>
    </div>

    <div class="bot-input-row">
      <input
        type="text"
        id="botInput"
        placeholder='Ví dụ: /help hoặc "2fo"'>
      <button
        type="button"
        class="bot-send"
        onclick="runBot()">
        Tra cứu
      </button>
    </div>

    <div id="botHelp" class="bot-help">
      Không biết lệnh? Nhập <b>/help</b>. Bạn cũng có thể nhập
      <b>3–4 ký tự</b> để tìm nhanh.
    </div>

    <div id="botResult" class="bot-result"></div>

  </div>

  <div class="mini-stats">

    <div class="mini-stat">
      <span>Tổng bản ghi</span>
      <b id="tong">0</b>
    </div>

    <div class="mini-stat">
      <span>Tổng số lượng</span>
      <b id="tongsl">0</b>
    </div>

  </div>

  <div class="card">
    <div class="topbar">

      <input
        type="text"
        id="search"
        placeholder="🔎 Tìm mặt hàng...">

      <input
        type="text"
        id="searchNV"
        placeholder="👤 Tìm nhân viên...">

      <select id="huyenFilter">
        <option value="">Tất cả huyện</option>
      </select>

      <select id="loaiFilter">
        <option value="">Tất cả loại mặt hàng</option>
      </select>

    </div>
  </div>

</div>

<div class="table-wrap">

  <table>
    <thead>
      <tr>
        <th>Mặt hàng</th>
        <th>ĐVT</th>
        <th>SL</th>
        <th>Nhân viên</th>
        <th>Huyện</th>
      </tr>
    </thead>

    <tbody id="tbody">
      <tr>
        <td colspan="5" class="loading">
          ⏳ Đang tải dữ liệu...
        </td>
      </tr>
    </tbody>
  </table>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyqb1Qf8YHiaPvlFKAX872-o6sf6a_GcQCy_2l9poMeYXyePFEjKnxTtpJHImaAQ0JTVg/exec?sheet=Data%20kho";

let allData = [];
let currentData = [];

/* ===== LOAD DATA ===== */

async function loadData(){

  try{

    const res = await fetch(API_URL);
    const json = await res.json();

    allData = json.data || [];

    allData.sort((a,b) => {
      return Number(b.sl || 0) - Number(a.sl || 0);
    });

    currentData = [...allData];

    renderTable(currentData);
    renderStats(currentData);
    renderHuyen(allData);
    renderLoaiMH(allData);

    /* Hiện giao diện sau khi tải xong */
    hideLoader();

  }catch(err){

    document.getElementById("tbody").innerHTML = `
      <tr>
        <td colspan="5" class="loading">
          ❌ Lỗi tải dữ liệu
        </td>
      </tr>
    `;

    console.log(err);

    /* Không để màn hình loading bị treo */
    hideLoader();

  }
}

/* ===== HIDE LOADER ===== */

function hideLoader(){

  const loader = document.getElementById("pageLoader");

  setTimeout(() => {
    loader.classList.add("hide");
  }, 180);

}

/* ===== TABLE ===== */

function renderTable(data){

  if(data.length === 0){

    document.getElementById("tbody").innerHTML = `
      <tr>
        <td colspan="5" class="loading">
          Không có dữ liệu
        </td>
      </tr>
    `;

    document.getElementById("lastUpdate").innerText = "--";

    return;
  }

  let html = "";

  data.forEach(item => {

    html += `
      <tr>
        <td>${escapeHtml(item.mh || "")}</td>
        <td>${escapeHtml(item.dv || "")}</td>
        <td class="sl-cell">${escapeHtml(item.sl ?? 0)}</td>
        <td>${escapeHtml(item.nv || "")}</td>
        <td>${escapeHtml(item.huyen || "")}</td>
      </tr>
    `;

  });

  document.getElementById("tbody").innerHTML = html;

  let last = data[0].tg || "--";

  document.getElementById("lastUpdate").innerText = last;
}

/* ===== ESCAPE HTML ===== */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* ===== STATS ===== */

function renderStats(data){

  document.getElementById("tong").innerText =
    data.length.toLocaleString("vi-VN");

  let tongsl = 0;

  data.forEach(i => {
    tongsl += Number(i.sl || 0);
  });

  document.getElementById("tongsl").innerText =
    tongsl.toLocaleString("vi-VN");
}

/* ===== HUYỆN ===== */

function renderHuyen(data){

  let arr = [...new Set(
    data.map(i => i.huyen).filter(Boolean)
  )];

  arr.sort();

  let html =
    `<option value="">Tất cả huyện</option>`;

  arr.forEach(h => {

    html += `
      <option value="${escapeHtml(h)}">
        ${escapeHtml(h)}
      </option>
    `;

  });

  document.getElementById("huyenFilter").innerHTML =
    html;
}

/* ===== LOẠI MẶT HÀNG ===== */

function renderLoaiMH(data){

  let arr = [...new Set(
    data.map(i => i.loaimh).filter(Boolean)
  )];

  arr.sort();

  let html =
    `<option value="">Tất cả loại mặt hàng</option>`;

  arr.forEach(loai => {

    html += `
      <option value="${escapeHtml(loai)}">
        ${escapeHtml(loai)}
      </option>
    `;

  });

  document.getElementById("loaiFilter").innerHTML =
    html;
}

/* ===== FILTER ===== */

function filterData(){

  let keyword =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

  let keywordNV =
    document.getElementById("searchNV")
    .value
    .toLowerCase()
    .trim();

  let huyen =
    document.getElementById("huyenFilter")
    .value;

  let loai =
    document.getElementById("loaiFilter")
    .value;

  currentData = allData.filter(i => {

    let okSearch =
      String(i.mh || "")
      .toLowerCase()
      .includes(keyword);

    let okNV =
      String(i.nv || "")
      .toLowerCase()
      .includes(keywordNV);

    let okHuyen =
      !huyen || i.huyen === huyen;

    let okLoai =
      !loai || i.loaimh === loai;

    return okSearch && okNV && okHuyen && okLoai;

  });

  renderTable(currentData);
  renderStats(currentData);
}

/* ===== EXCEL ===== */

function downloadExcel(){

  if(!currentData.length){

    alert("Không có dữ liệu để tải Excel.");
    return;

  }

  const excelData = currentData.map(item => ({
    "Mặt hàng": item.mh || "",
    "Đơn vị": item.dv || "",
    "Trạng thái": item.tt || "",
    "Số lượng": Number(item.sl || 0),
    "Nhân viên": item.nv || "",
    "Huyện": item.huyen || "",
    "Loại mặt hàng": item.loaimh || ""
  }));

  const ws = XLSX.utils.json_to_sheet(excelData);

  const header = [
    "Mặt hàng",
    "Đơn vị",
    "Trạng thái",
    "Số lượng",
    "Nhân viên",
    "Huyện",
    "Loại mặt hàng"
  ];

  header.forEach((text,index) => {

    const cell = ws[XLSX.utils.encode_cell({
      r:0,
      c:index
    })];

    if(cell){

      cell.s = {
        font:{
          bold:true,
          color:"FFFFFF",
          sz:11
        },
        fill:{
          patternType:"solid",
          fgColor:{
            rgb:"1976D2"
          }
        },
        alignment:{
          horizontal:"center",
          vertical:"center",
          wrapText:true
        },
        border:{
          top:{style:"thin",color:{rgb:"D9E2EC"}},
          bottom:{style:"thin",color:{rgb:"D9E2EC"}},
          left:{style:"thin",color:{rgb:"D9E2EC"}},
          right:{style:"thin",color:{rgb:"D9E2EC"}}
        }
      };

    }

  });

  const widths = header.map(title => {

    let maxLength = title.length;

    excelData.forEach(row => {

      maxLength = Math.max(
        maxLength,
        String(row[title] ?? "").length
      );

    });

    return {
      wch:Math.min(
        Math.max(maxLength + 2,10),
        40
      )
    };

  });

  ws["!cols"] = widths;

  ws["!rows"] = [
    {hpt:24}
  ];

  ws["!freeze"] = {
    xSplit:0,
    ySplit:1
  };

  ws["!autofilter"] = {
    ref:`A1:G${excelData.length + 1}`
  };

  const centerCols = [1,2,4,5];

  for(let r = 1; r <= excelData.length; r++){

    centerCols.forEach(c => {

      const cell =
        ws[XLSX.utils.encode_cell({
          r:r,
          c:c
        })];

      if(cell){

        cell.s = {
          alignment:{
            horizontal:"center",
            vertical:"center",
            wrapText:true
          }
        };

      }

    });

    const slCell =
      ws[XLSX.utils.encode_cell({
        r:r,
        c:3
      })];

    if(slCell){

      slCell.s = {
        font:{
          bold:true
        },
        alignment:{
          horizontal:"right",
          vertical:"center"
        },
        numFmt:'#,##0'
      };

    }

  }

  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "Kho vật tư"
  );

  const now = new Date();

  const date =
    String(now.getDate()).padStart(2,"0") +
    String(now.getMonth()+1).padStart(2,"0") +
    now.getFullYear();

  const time =
    String(now.getHours()).padStart(2,"0") +
    String(now.getMinutes()).padStart(2,"0");

  const fileName =
    `Kho_vat_tu_${date}_${time}.xlsx`;

  /*
    Xuất thành ArrayBuffer rồi tạo Blob.
    Cách này ổn định hơn window.open() trên trình duyệt mobile,
    tránh trường hợp hệ thống lưu file Excel thành .bin.
  */
  const excelBuffer = XLSX.write(wb, {
    bookType:"xlsx",
    type:"array"
  });

  const blob = new Blob(
    [excelBuffer],
    {
      type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    }
  );

  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");

  link.href = url;
  link.download = fileName;
  link.style.display = "none";

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 3000);

}

/* ===== BOT TRA CỨU ===== */

function normalizeText(value){
  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim();
}

function runBot(){

  const input = document.getElementById("botInput");
  const result = document.getElementById("botResult");
  const help = document.getElementById("botHelp");

  const raw = input.value.trim();

  if(!raw){
    result.innerHTML =
      "⚠️ Hãy nhập <b>/help</b> hoặc ít nhất 3 ký tự để tra cứu.";
    return;
  }

  if(normalizeText(raw) === "/help"){

    help.style.display = "none";

    result.innerHTML = `
      <b>📖 HƯỚNG DẪN BOT</b><br><br>

      <b>/help</b> — Xem hướng dẫn sử dụng.<br><br>

      <b>🔎 Tìm nhanh 3–4 ký tự</b><br>
      Ví dụ: <b>2fo</b>, <b>g059</b>, <b>ple</b>, <b>nguy</b>.<br>
      Bot tìm trong Mặt hàng, Đơn vị, Trạng thái,
      Nhân viên, Huyện và Loại mặt hàng.<br><br>

      <b>💬 Có thể nhập tên cần tìm</b><br>
      Ví dụ: <b>Nguyễn Văn A</b>, <b>Pleiku</b>, <b>dây 2FO</b>.<br><br>

      <b>💡 Không biết lệnh?</b><br>
      Chỉ cần nhớ <b>/help</b> hoặc nhập 3–4 ký tự liên quan.
    `;

    return;
  }

  help.style.display = "none";

  const key = normalizeText(raw);

  /* Tìm nhanh 3–4 ký tự */
  if(key.length >= 3 && key.length <= 4){

    const matches = allData.filter(item => {

      const fields = [
        item.mh,
        item.dv,
        item.tt,
        item.nv,
        item.huyen,
        item.loaimh
      ];

      return fields.some(value =>
        normalizeText(value).includes(key)
      );

    });

    renderBotResults(
      matches,
      `🔎 Tìm nhanh "${escapeHtml(raw)}"`
    );

    return;
  }

  /* Tìm theo chuỗi dài hơn */
  const matches = allData.filter(item => {

    const fields = [
      item.mh,
      item.dv,
      item.tt,
      item.nv,
      item.huyen,
      item.loaimh
    ];

    return fields.some(value =>
      normalizeText(value).includes(key)
    );

  });

  renderBotResults(
    matches,
    `🔎 Kết quả cho "${escapeHtml(raw)}"`
  );
}

function renderBotResults(data,title){

  const result = document.getElementById("botResult");

  if(!data.length){

    result.innerHTML = `
      <b>${title}</b><br><br>
      ❌ Không tìm thấy dữ liệu phù hợp.<br>
      Thử từ khóa khác hoặc nhập <b>/help</b>.
    `;

    return;
  }

  const showData = data.slice(0,50);

  let totalSL = 0;

  data.forEach(item => {
    totalSL += Number(item.sl || 0);
  });

  let html = `
    <b>${title}</b><br>
    Tìm thấy <b>${data.length.toLocaleString("vi-VN")}</b> bản ghi
    — tổng số lượng <b>${totalSL.toLocaleString("vi-VN")}</b>.
  `;

  if(data.length > 50){
    html += `<br><span style="color:#78909c">
      Đang hiển thị 50 kết quả đầu tiên.
    </span>`;
  }

  html += `
    <table>
      <thead>
        <tr>
          <th>Mặt hàng</th>
          <th>SL</th>
          <th>Nhân viên</th>
          <th>Huyện</th>
        </tr>
      </thead>
      <tbody>
  `;

  showData.forEach(item => {

    html += `
      <tr>
        <td>${escapeHtml(item.mh || "")}</td>
        <td style="text-align:right;font-weight:bold">
          ${escapeHtml(item.sl ?? 0)}
        </td>
        <td>${escapeHtml(item.nv || "")}</td>
        <td>${escapeHtml(item.huyen || "")}</td>
      </tr>
    `;

  });

  html += `
      </tbody>
    </table>
  `;

  result.innerHTML = html;
}

document

loadData();

</script>
