<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kho vật tư</title>

<!-- Thư viện tạo Excel trực tiếp từ dữ liệu đang có trên giao diện -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fa;
  color:#263238;
}

/* ===== LOADING ===== */
#pageLoader{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:14px;
  background:rgba(243,246,250,.78);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
  transition:opacity .35s ease, visibility .35s ease;
}

#pageLoader.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loader-spinner{
  width:46px;
  height:46px;
  border:4px solid #dbe5f0;
  border-top-color:#1976d2;
  border-right-color:#42a5f5;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

.loader-text{
  color:#546e7a;
  font-size:13px;
  font-weight:600;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

/* ===== HEADER ===== */
.sticky-top{
  position:sticky;
  top:0;
  z-index:999;
  background:rgba(243,246,250,.96);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  padding:10px;
}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

h2{
  margin:0;
  font-size:21px;
  color:#263238;
  letter-spacing:.2px;
}

.update-time{
  color:#78909c;
  margin:4px 0 9px;
  font-size:11px;
}

/* ===== BUTTON ===== */
button{
  border:none;
  background:#1976d2;
  color:white;
  border-radius:7px;
  cursor:pointer;
  transition:.18s ease;
}

button:hover{
  filter:brightness(.96);
  transform:translateY(-1px);
}

.excel-btn{
  min-height:34px;
  padding:0 13px;
  background:#2e7d32;
  font-size:12px;
  font-weight:600;
  box-shadow:0 2px 5px rgba(46,125,50,.18);
}

/* ===== STATS ===== */
.mini-stats{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.mini-stat{
  flex:1;
  background:white;
  border:1px solid #e5ebf1;
  border-radius:10px;
  padding:9px 12px;
  box-shadow:0 2px 8px rgba(31,45,61,.06);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.mini-stat span{
  font-size:12px;
  color:#607d8b;
}

.mini-stat b{
  font-size:16px;
  color:#263238;
}

/* ===== FILTER CARD ===== */
.card{
  background:white;
  border:1px solid #e5ebf1;
  border-radius:11px;
  padding:10px;
  margin-bottom:10px;
  box-shadow:0 2px 8px rgba(31,45,61,.06);
}

.topbar{
  display:grid;
  grid-template-columns:1.3fr 1.1fr 1fr 1.15fr;
  gap:8px;
}

input,select{
  width:100%;
  min-height:36px;
  padding:8px 10px;
  border:1px solid #d5dee7;
  border-radius:7px;
  background:#fff;
  color:#37474f;
  outline:none;
  transition:border-color .18s, box-shadow .18s;
}

input::placeholder{
  color:#90a4ae;
}

input:focus,select:focus{
  border-color:#64b5f6;
  box-shadow:0 0 0 3px rgba(33,150,243,.10);
}


/* ===== PHÂN TÍCH BOT ===== */
.analysis-title{
  font-size:14px;
  font-weight:700;
  color:#263238;
  margin-bottom:8px;
}

.analysis-summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin:8px 0 10px;
}

.analysis-stat{
  background:white;
  border:1px solid #e1e8ef;
  border-radius:8px;
  padding:7px;
  text-align:center;
}

.analysis-stat span{
  display:block;
  font-size:10px;
  color:#78909c;
  margin-bottom:3px;
}

.analysis-stat b{
  font-size:13px;
  color:#1976d2;
}

.analysis-section{
  margin-top:10px;
}

.analysis-section > b{
  display:block;
  margin-bottom:6px;
  color:#455a64;
}

.analysis-list{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.analysis-type-card,
.analysis-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:white;
  border:1px solid #e1e8ef;
  border-radius:8px;
  padding:7px 9px;
}

.analysis-type-card > div:first-child{
  display:flex;
  align-items:center;
  gap:7px;
}

.analysis-type-card strong{
  color:#1976d2;
  font-size:12px;
}

.analysis-type-card small,
.analysis-type-number small{
  display:block;
  font-size:10px;
  color:#78909c;
}

.analysis-type-number{
  text-align:right;
  font-size:13px;
  font-weight:700;
}

.analysis-row{
  font-size:11px;
}

.analysis-row strong{
  color:#1976d2;
  white-space:nowrap;
}

.analysis-assessment{
  background:#f7fafc;
  border:1px solid #e1e8ef;
  border-radius:8px;
  padding:8px 9px;
  font-size:11px;
  line-height:1.5;
  color:#455a64;
}

.analysis-hint{
  margin-top:10px;
  padding:7px 8px;
  border-radius:7px;
  background:#eef6ff;
  color:#607d8b;
  font-size:10.5px;
  line-height:1.4;
}

@media(max-width:768px){

  .analysis-summary{
    grid-template-columns:repeat(2,1fr);
  }

  .analysis-stat{
    padding:6px;
  }

  .analysis-stat b{
    font-size:12px;
  }

}


/* ===== BOT NỔI / CỬA SỔ CHAT ===== */
.bot-fab{
  position:fixed !important;
  right:16px !important;
  bottom:16px !important;
  z-index:3000;
  width:50px;
  height:50px;
  padding:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  background:#1976d2;
  color:#fff;
  box-shadow:0 5px 18px rgba(25,118,210,.30);
  border:2px solid rgba(255,255,255,.9);
}

.bot-fab:hover{
  transform:translateY(-2px);
}

.bot-panel{
  position:fixed !important;
  right:16px !important;
  bottom:78px !important;
  z-index:2999;
  width:390px;
  max-width:calc(100vw - 24px);
  height:min(620px,calc(100vh - 100px));
  display:none;
  flex-direction:column;
  overflow:hidden;
  background:#f5f8fb;
  border:1px solid #d6e0e8;
  border-radius:14px;
  box-shadow:0 10px 35px rgba(31,45,61,.22);
}

.bot-panel.open{
  display:flex;
  animation:botOpen .18s ease-out;
}

@keyframes botOpen{
  from{
    opacity:0;
    transform:translateY(8px) scale(.98);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.bot-panel-header{
  min-height:52px;
  padding:9px 11px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#1976d2;
  color:white;
}

.bot-panel-header strong{
  display:block;
  font-size:14px;
}

.bot-panel-header small{
  display:block;
  margin-top:2px;
  font-size:10px;
  opacity:.82;
}

.bot-close{
  width:32px;
  height:32px;
  padding:0;
  border-radius:50%;
  background:rgba(255,255,255,.16);
  font-size:23px;
  line-height:1;
}

.bot-panel-body{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:9px;
}

.bot-input-row{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

#botInput{
  flex:1;
  min-width:0;
}

.bot-send{
  min-width:58px;
  padding:0 10px;
  font-size:12px;
  font-weight:600;
}

.bot-help{
  margin:7px 2px;
  color:#607d8b;
  font-size:10.5px;
  line-height:1.4;
  flex-shrink:0;
}

.bot-result{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:8px;
  border-radius:9px;
  background:#eef3f7;
  border:1px solid #dce5ec;
  font-size:12px;
  line-height:1.45;
  color:#455a64;
}

.bot-result:empty{
  display:block;
}

.bot-result b{
  color:#263238;
}

.bot-list{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:8px;
}

.bot-item{
  background:white;
  border:1px solid #e1e8ef;
  border-radius:8px;
  padding:8px 9px;
  box-shadow:0 1px 3px rgba(31,45,61,.04);
}

.bot-item-main{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
}

.bot-item-name{
  flex:1;
  min-width:0;
  font-size:12px;
  font-weight:700;
  color:#263238;
  line-height:1.3;
  word-break:break-word;
}

.bot-item-sl{
  flex-shrink:0;
  font-size:13px;
  font-weight:700;
  color:#1976d2;
  white-space:nowrap;
}

.bot-item-info{
  display:flex;
  flex-wrap:wrap;
  gap:3px 10px;
  margin-top:4px;
  color:#607d8b;
  font-size:10.5px;
  line-height:1.35;
}

.bot-tag{
  display:inline-block;
}

@media(max-width:768px){

  .bot-fab{
    right:12px !important;
    bottom:12px !important;
    width:46px;
    height:46px;
    font-size:21px;
  }

  .bot-panel{
    right:8px !important;
    bottom:66px !important;
    width:calc(100vw - 16px);
    max-width:none;
    height:min(76vh,620px);
    border-radius:13px;
  }

  .bot-panel-header{
    min-height:48px;
  }

  .bot-panel-body{
    padding:7px;
  }

  .bot-result{
    padding:7px;
  }

  .bot-item{
    padding:8px;
  }

}


/* ===== TABLE ===== */
.table-wrap{
  height:calc(100vh - 180px);
  min-height:300px;
  overflow:auto;
  background:white;
  border:1px solid #d6e0e8;
  border-radius:11px;
  box-shadow:0 2px 9px rgba(31,45,61,.07);
  overflow:auto;
}

table{
  width:auto;
  min-width:100%;
  border-collapse:separate;
  border-spacing:0;
  table-layout:auto;
}

thead th{
  background:#1976d2;
  color:white;
  position:sticky;
  top:0;
  z-index:10;
  font-weight:600;
  box-shadow:0 1px 0 rgba(0,0,0,.08);
}

th,td{
  padding:8px 10px;
  border-right:1px solid #e2e8ee;
  border-bottom:1px solid #e5ebf0;
  font-size:13px;
  vertical-align:middle;
  text-align:left;
}

thead th:first-child{
  border-top-left-radius:10px;
}

tbody tr:nth-child(even){
  background:#f7faff;
}

tbody tr:nth-child(odd){
  background:#fff;
}

tbody tr:hover{
  background:#eaf3ff;
}

tbody tr:active{
  background:#dbeaff;
}

th:not(:first-child),
td:not(:first-child){
  white-space:nowrap;
}

/* Cột mặt hàng cố định */
thead th:first-child{
  left:0;
  z-index:20;
  min-width:145px;
  max-width:240px;
  white-space:normal;
  word-break:break-word;
  line-height:1.25;
}

tbody td:first-child{
  position:sticky;
  left:0;
  z-index:5;
  min-width:145px;
  max-width:240px;
  white-space:normal;
  word-break:break-word;
  line-height:1.3;
  font-weight:600;
}

/* Nền của cột sticky phải theo từng dòng */
tbody tr:nth-child(even) td:first-child{
  background:#f7faff;
}

tbody tr:nth-child(odd) td:first-child{
  background:#fff;
}

tbody tr:hover td:first-child{
  background:#eaf3ff;
}

td.sl-cell{
  text-align:right;
  font-weight:700;
}

.loading{
  padding:30px !important;
  text-align:center !important;
  color:#78909c;
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){

  .sticky-top{
    padding:6px;
  }

  h2{
    font-size:19px;
  }

  .excel-btn{
    min-height:32px;
    padding:0 10px;
    font-size:11px;
  }

  .mini-stats{
    gap:6px;
  }

  .mini-stat{
    padding:8px 10px;
  }

  .mini-stat span{
    font-size:11px;
  }

  .mini-stat b{
    font-size:15px;
  }

  .topbar{
    grid-template-columns:1fr 1fr;
    gap:6px;
  }

  input,select{
    min-height:34px;
    font-size:12px;
  }

  table{
    min-width:100%;
  }

  th,td{
    font-size:12px;
    padding:6px;
  }

  thead th:first-child,
  tbody td:first-child{
    min-width:105px;
    max-width:105px;
  }

  th:nth-child(2),
  td:nth-child(2){
    min-width:42px;
  }

  th:nth-child(3),
  td:nth-child(3){
    min-width:38px;
  }

  th:nth-child(4),
  td:nth-child(4){
    min-width:105px;
    max-width:125px;
    white-space:normal;
    word-break:break-word;
    line-height:1.2;
  }

  th:nth-child(5),
  td:nth-child(5){
    min-width:55px;
    max-width:70px;
    white-space:normal;
    word-break:break-word;
    line-height:1.2;
  }

  .table-wrap{
    height:calc(100vh - 205px);
  }
}

/* ===== BOT PHÓNG TO + PHÂN TÍCH CHỦNG LOẠI ===== */
.bot-header-actions{display:flex;align-items:center;gap:4px}
.bot-max,.bot-close{width:32px;height:32px;padding:0;border-radius:50%;background:rgba(255,255,255,.16);color:white;font-size:18px;line-height:1}
.bot-max:hover,.bot-close:hover{background:rgba(255,255,255,.25)}
.bot-panel.maximized{top:10px !important;right:10px !important;bottom:10px !important;left:10px !important;width:auto !important;max-width:none !important;height:auto !important;border-radius:12px}
.product-analysis-card{background:white;border:1px solid #dfe7ee;border-radius:9px;padding:9px;box-shadow:0 1px 3px rgba(31,45,61,.04)}
.product-analysis-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.product-analysis-name{display:flex;align-items:flex-start;gap:7px;min-width:0}
.product-analysis-name strong{font-size:12px;line-height:1.35;color:#263238;word-break:break-word}
.product-index{flex-shrink:0;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eaf3fb;color:#1976d2;font-size:10px;font-weight:700}
.product-analysis-total{flex-shrink:0;text-align:right;font-size:14px;font-weight:700;color:#1976d2}
.product-analysis-total small{display:block;font-size:9px;font-weight:400;color:#78909c}
.product-analysis-types{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}
.product-type{display:flex;justify-content:space-between;align-items:center;padding:5px 6px;border-radius:6px;background:#f5f8fb;font-size:10px}
.product-type b{color:#607d8b}.product-type span{font-weight:700;color:#263238}
.product-analysis-meta{margin-top:7px;color:#607d8b;font-size:10px;line-height:1.45}
.product-analysis-note{margin-top:6px;padding-top:6px;border-top:1px solid #edf1f4;color:#455a64;font-size:10px;line-height:1.45}
@media(max-width:768px){.bot-panel.maximized{top:5px !important;right:5px !important;bottom:5px !important;left:5px !important}}

.bot-next-commands{margin-bottom:8px}
.bot-command-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.bot-command-grid button{border:1px solid #d9e3eb;background:white;color:#455a64;border-radius:7px;padding:7px 6px;font-size:10.5px;text-align:left}
.bot-command-grid button:hover{background:#eef6ff;border-color:#90caf9;color:#1565c0}


/* ===== YOUTUBE RED / BLACK / WHITE THEME OVERRIDE ===== */
:root{
  --yt-red:#ff0033;
  --yt-red-dark:#cc0029;
  --yt-black:#0f0f0f;
  --yt-black-2:#181818;
  --yt-white:#ffffff;
  --yt-gray:#f5f5f5;
  --yt-border:#e5e5e5;
  --yt-text:#111111;
  --yt-muted:#666666;
}

html,body{
  background:#fff !important;
  color:var(--yt-text) !important;
}

#pageLoader{
  background:#050505 !important;
}
.loader-spinner{
  width:50px !important;
  height:50px !important;
  border:4px solid #2b2b2b !important;
  border-top-color:var(--yt-red) !important;
  border-right-color:#ffffff !important;
  border-radius:50% !important;
  box-shadow:0 0 18px rgba(255,0,51,.18) !important;
}
.loader-text{
  color:#ffffff !important;
  font-weight:600 !important;
  letter-spacing:.2px !important;
}

.sticky-top{
  background:var(--yt-black) !important;
  border-bottom:3px solid var(--yt-red) !important;
  box-shadow:0 2px 12px rgba(0,0,0,.16) !important;
  padding:8px 10px !important;
}
h2{
  color:#fff !important;
  font-size:19px !important;
  letter-spacing:.3px !important;
}
.update-time{color:#bdbdbd !important;}

button{
  background:var(--yt-red) !important;
  color:#fff !important;
  border-radius:999px !important;
}
button:hover{
  background:var(--yt-red-dark) !important;
  filter:none !important;
}

.excel-btn{
  background:#fff !important;
  color:#111 !important;
  border:1px solid #ddd !important;
  box-shadow:none !important;
  border-radius:999px !important;
}
.excel-btn:hover{
  background:#f1f1f1 !important;
  color:#111 !important;
}

.mini-stat,.card{
  background:#fff !important;
  border-color:var(--yt-border) !important;
  box-shadow:none !important;
}
.mini-stat{border-radius:10px !important;}
.mini-stat span{color:#666 !important;}
.mini-stat b{color:#111 !important;}
.card{padding:8px !important;}

input,select{
  border-color:#d8d8d8 !important;
  background:#fff !important;
  color:#111 !important;
  border-radius:8px !important;
}
input:focus,select:focus{
  border-color:var(--yt-red) !important;
  box-shadow:0 0 0 3px rgba(255,0,51,.10) !important;
}

/* Bot */
.bot-fab{
  background:var(--yt-red) !important;
  color:#fff !important;
  border-color:#fff !important;
  box-shadow:0 7px 22px rgba(255,0,51,.32) !important;
  font-size:0 !important;
}
.bot-fab::after{
  content:"💬" !important;
  font-size:21px !important;
}
.bot-panel{
  background:#fff !important;
  border:1px solid #d9d9d9 !important;
  box-shadow:0 14px 40px rgba(0,0,0,.24) !important;
}
.bot-panel-header{
  background:var(--yt-black) !important;
  border-bottom:3px solid var(--yt-red) !important;
}
.bot-panel-header strong{color:#fff !important;}
.bot-panel-header small{color:#c7c7c7 !important;}
.bot-max,.bot-close{
  background:#2a2a2a !important;
  color:#fff !important;
}
.bot-max:hover,.bot-close:hover{background:var(--yt-red) !important;}
.bot-panel-body{background:#fff !important;}
.bot-help{color:#666 !important;}
.bot-result{
  background:#f7f7f7 !important;
  border-color:#e1e1e1 !important;
  color:#222 !important;
}
.bot-result b{color:#111 !important;}
.bot-send{
  background:var(--yt-red) !important;
  border-radius:999px !important;
}
.bot-item,.product-analysis-card{
  background:#fff !important;
  border-color:#e2e2e2 !important;
  box-shadow:none !important;
}
.bot-item-sl,.analysis-stat b,.analysis-type-card strong,
.analysis-row strong,.product-analysis-total{
  color:var(--yt-red) !important;
}
.bot-item-info,.analysis-type-card small,.analysis-type-number small{
  color:#777 !important;
}
.bot-command-grid button{
  background:#fff !important;
  color:#222 !important;
  border-color:#ddd !important;
  border-radius:999px !important;
}
.bot-command-grid button:hover{
  background:#fff5f7 !important;
  border-color:var(--yt-red) !important;
  color:var(--yt-red) !important;
}

/* Analysis cards and warnings */
.analysis-title{color:#111 !important;}
.analysis-stat,.analysis-type-card,.analysis-row{

<body>

<!-- Màn hình loading -->
<div id="pageLoader">
  <div class="loader-spinner"></div>
  <div class="loader-text">Đang tải dữ liệu kho...</div>
</div>

<div class="sticky-top">

  <div class="header-row">
    <h2>📦 KHO VẬT TƯ</h2>

    <button
      class="excel-btn"
      onclick="downloadExcel()">
      Tải file Excel
    </button>
  </div>

  <div class="update-time">
    Cập nhật: <span id="lastUpdate">--</span>
  </div>


  <div class="mini-stats">

    <div class="mini-stat">
      <span>Tổng bản ghi</span>
      <b id="tong">0</b>
    </div>

    <div class="mini-stat">
      <span>Tổng số lượng</span>
      <b id="tongsl">0</b>
    </div>

  </div>

  <div class="card">
    <div class="topbar">

      <input
        type="text"
        id="search"
        placeholder="🔎 Tìm mặt hàng...">

      <input
        type="text"
        id="searchNV"
        placeholder="👤 Tìm nhân viên...">

      <select id="huyenFilter">
        <option value="">Tất cả huyện</option>
      </select>

      <select id="loaiFilter">
        <option value="">Tất cả loại mặt hàng</option>
      </select>

    </div>
  </div>

</div>

  <!-- BOT NỔI -->
  <button
    type="button"
    id="botFab"
    class="bot-fab"
    onclick="toggleBot()"
    aria-label="Mở trợ lý tra cứu">
    💬
  </button>

  <div id="botPanel" class="bot-panel">

    <div class="bot-panel-header">
      <div>
        <strong>💬 Trợ lý tra cứu kho</strong>
        <small>TK · TH · UCTT</small>
      </div>

      <div class="bot-header-actions">
        <button type="button" class="bot-max" onclick="toggleBotMax()" aria-label="Phóng to bot">⛶</button>
        <button type="button" class="bot-close" onclick="toggleBot()" aria-label="Đóng bot">×</button>
      </div>
    </div>

    <div class="bot-panel-body">

      <div class="bot-input-row">
        <input
          type="text"
          id="botInput"
          placeholder='Ví dụ: HC25, HC25 TK, HC25 line'>
        <button
          type="button"
          class="bot-send"
          onclick="runBot()">
          Gửi
        </button>
      </div>

      <div id="botHelp" class="bot-help">
        Nhập <b>/help</b> để xem lệnh. Có thể hỏi trực tiếp mã/tên vật tư.
      </div>

      <div id="botResult" class="bot-result"></div>

    </div>

  </div>


<div class="table-wrap">

  <table>
    <thead>
      <tr>
        <th>Mặt hàng</th>
        <th>ĐVT</th>
        <th>SL</th>
        <th>Nhân viên</th>
        <th>Huyện</th>
      </tr>
    </thead>

    <tbody id="tbody">
      <tr>
        <td colspan="5" class="loading">
          ⏳ Đang tải dữ liệu...
        </td>
      </tr>
    </tbody>
  </table>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyqb1Qf8YHiaPvlFKAX872-o6sf6a_GcQCy_2l9poMeYXyePFEjKnxTtpJHImaAQ0JTVg/exec?sheet=Data%20kho";

let allData = [];
let currentData = [];

/* ===== LOAD DATA ===== */

async function loadData(){

  try{

    const res = await fetch(API_URL);
    const json = await res.json();

    allData = json.data || [];

    allData.sort((a,b) => {
      return Number(b.sl || 0) - Number(a.sl || 0);
    });

    currentData = [...allData];

    renderTable(currentData);
    renderStats(currentData);
    renderHuyen(allData);
    renderLoaiMH(allData);

    /* Hiện giao diện sau khi tải xong */
    hideLoader();

  }catch(err){

    document.getElementById("tbody").innerHTML = `
      <tr>
        <td colspan="5" class="loading">
          ❌ Lỗi tải dữ liệu
        </td>
      </tr>
    `;

    console.log(err);

    /* Không để màn hình loading bị treo */
    hideLoader();

  }
}

/* ===== HIDE LOADER ===== */

function hideLoader(){

  const loader = document.getElementById("pageLoader");

  setTimeout(() => {
    loader.classList.add("hide");
  }, 180);

}

/* ===== TABLE ===== */

function renderTable(data){

  if(data.length === 0){

    document.getElementById("tbody").innerHTML = `
      <tr>
        <td colspan="5" class="loading">
          Không có dữ liệu
        </td>
      </tr>
    `;

    document.getElementById("lastUpdate").innerText = "--";

    return;
  }

  let html = "";

  data.forEach(item => {

    html += `
      <tr>
        <td>${escapeHtml(item.mh || "")}</td>
        <td>${escapeHtml(item.dv || "")}</td>
        <td class="sl-cell">${escapeHtml(item.sl ?? 0)}</td>
        <td>${escapeHtml(item.nv || "")}</td>
        <td>${escapeHtml(item.huyen || "")}</td>
      </tr>
    `;

  });

  document.getElementById("tbody").innerHTML = html;

  let last = data[0].tg || "--";

  document.getElementById("lastUpdate").innerText = last;
}

/* ===== ESCAPE HTML ===== */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* ===== STATS ===== */

function renderStats(data){

  document.getElementById("tong").innerText =
    data.length.toLocaleString("vi-VN");

  let tongsl = 0;

  data.forEach(i => {
    tongsl += Number(i.sl || 0);
  });

  document.getElementById("tongsl").innerText =
    tongsl.toLocaleString("vi-VN");
}

/* ===== HUYỆN ===== */

function renderHuyen(data){

  let arr = [...new Set(
    data.map(i => i.huyen).filter(Boolean)
  )];

  arr.sort();

  let html =
    `<option value="">Tất cả huyện</option>`;

  arr.forEach(h => {

    html += `
      <option value="${escapeHtml(h)}">
        ${escapeHtml(h)}
      </option>
    `;

  });

  document.getElementById("huyenFilter").innerHTML =
    html;
}

/* ===== LOẠI MẶT HÀNG ===== */

function renderLoaiMH(data){

  let arr = [...new Set(
    data.map(i => i.loaimh).filter(Boolean)
  )];

  arr.sort();

  let html =
    `<option value="">Tất cả loại mặt hàng</option>`;

  arr.forEach(loai => {

    html += `
      <option value="${escapeHtml(loai)}">
        ${escapeHtml(loai)}
      </option>
    `;

  });

  document.getElementById("loaiFilter").innerHTML =
    html;
}

/* ===== FILTER ===== */

function filterData(){

  let keyword =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

  let keywordNV =
    document.getElementById("searchNV")
    .value
    .toLowerCase()
    .trim();

  let huyen =
    document.getElementById("huyenFilter")
    .value;

  let loai =
    document.getElementById("loaiFilter")
    .value;

  currentData = allData.filter(i => {

    let okSearch =
      String(i.mh || "")
      .toLowerCase()
      .includes(keyword);

    let okNV =
      String(i.nv || "")
      .toLowerCase()
      .includes(keywordNV);

    let okHuyen =
      !huyen || i.huyen === huyen;

    let okLoai =
      !loai || i.loaimh === loai;

    return okSearch && okNV && okHuyen && okLoai;

  });

  renderTable(currentData);
  renderStats(currentData);
}

/* ===== EXCEL ===== */

function downloadExcel(){

  if(!currentData.length){

    alert("Không có dữ liệu để tải Excel.");
    return;

  }

  const excelData = currentData.map(item => ({
    "Mặt hàng": item.mh || "",
    "Đơn vị": item.dv || "",
    "Trạng thái": item.tt || "",
    "Số lượng": Number(item.sl || 0),
    "Nhân viên": item.nv || "",
    "Huyện": item.huyen || "",
    "Loại mặt hàng": item.loaimh || ""
  }));

  const ws = XLSX.utils.json_to_sheet(excelData);

  const header = [
    "Mặt hàng",
    "Đơn vị",
    "Trạng thái",
    "Số lượng",
    "Nhân viên",
    "Huyện",
    "Loại mặt hàng"
  ];

  header.forEach((text,index) => {

    const cell = ws[XLSX.utils.encode_cell({
      r:0,
      c:index
    })];

    if(cell){

      cell.s = {
        font:{
          bold:true,
          color:"FFFFFF",
          sz:11
        },
        fill:{
          patternType:"solid",
          fgColor:{
            rgb:"1976D2"
          }
        },
        alignment:{
          horizontal:"center",
          vertical:"center",
          wrapText:true
        },
        border:{
          top:{style:"thin",color:{rgb:"D9E2EC"}},
          bottom:{style:"thin",color:{rgb:"D9E2EC"}},
          left:{style:"thin",color:{rgb:"D9E2EC"}},
          right:{style:"thin",color:{rgb:"D9E2EC"}}
        }
      };

    }

  });

  const widths = header.map(title => {

    let maxLength = title.length;

    excelData.forEach(row => {

      maxLength = Math.max(
        maxLength,
        String(row[title] ?? "").length
      );

    });

    return {
      wch:Math.min(
        Math.max(maxLength + 2,10),
        40
      )
    };

  });

  ws["!cols"] = widths;

  ws["!rows"] = [
    {hpt:24}
  ];

  ws["!freeze"] = {
    xSplit:0,
    ySplit:1
  };

  ws["!autofilter"] = {
    ref:`A1:G${excelData.length + 1}`
  };

  const centerCols = [1,2,4,5];

  for(let r = 1; r <= excelData.length; r++){

    centerCols.forEach(c => {

      const cell =
        ws[XLSX.utils.encode_cell({
          r:r,
          c:c
        })];

      if(cell){

        cell.s = {
          alignment:{
            horizontal:"center",
            vertical:"center",
            wrapText:true
          }
        };

      }

    });

    const slCell =
      ws[XLSX.utils.encode_cell({
        r:r,
        c:3
      })];

    if(slCell){

      slCell.s = {
        font:{
          bold:true
        },
        alignment:{
          horizontal:"right",
          vertical:"center"
        },
        numFmt:'#,##0'
      };

    }

  }

  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "Kho vật tư"
  );

  const now = new Date();

  const date =
    String(now.getDate()).padStart(2,"0") +
    String(now.getMonth()+1).padStart(2,"0") +
    now.getFullYear();

  const time =
    String(now.getHours()).padStart(2,"0") +
    String(now.getMinutes()).padStart(2,"0");

  const fileName =
    `Kho_vat_tu_${date}_${time}.xlsx`;

  /*
    Xuất thành ArrayBuffer rồi tạo Blob.
    Cách này ổn định hơn window.open() trên trình duyệt mobile,
    tránh trường hợp hệ thống lưu file Excel thành .bin.
  */
  const excelBuffer = XLSX.write(wb, {
    bookType:"xlsx",
    type:"array"
  });

  const blob = new Blob(
    [excelBuffer],
    {
      type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    }
  );

  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");

  link.href = url;
  link.download = fileName;
  link.style.display = "none";

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 3000);

}

/* ===== BOT TRA CỨU ===== */

function normalizeText(value){
  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim();
}


function toggleBotMax(){
  const panel=document.getElementById("botPanel");
  panel.classList.toggle("maximized");
}

function toggleBot(){

  const panel = document.getElementById("botPanel");
  const input = document.getElementById("botInput");

  panel.classList.toggle("open");

  if(!panel.classList.contains("open")){
    panel.classList.remove("maximized");
  }

  if(panel.classList.contains("open")){
    setTimeout(() => input.focus(), 80);
  }

}

function runBot(){

  const input = document.getElementById("botInput");
  const result = document.getElementById("botResult");
  const help = document.getElementById("botHelp");

  const raw = input.value.trim();

  if(!raw){
    result.innerHTML =
      "⚠️ Nhập <b>/help</b> hoặc tên/mã mặt hàng cần tra cứu.";
    return;
  }

  if(normalizeText(raw) === "/help"){

    help.style.display = "none";

    result.innerHTML = `
      <b>📖 HƯỚNG DẪN TRỢ LÝ KHO</b><br><br>

      <b>📦 Quy ước loại hàng</b><br>
      • <b>TK</b> → Hàng triển khai<br>
      • <b>TH</b> → Hàng thu hồi<br>
      • <b>UCTT</b> → Hàng UCTT<br><br>

      <b>📊 Phân tích mặt hàng</b><br>
      Chỉ cần nhập mã/tên, ví dụ: <b>HC25</b>.<br>
      Bot tự tổng hợp tổng tồn, TK/TH/UCTT,
      huyện, nhân viên và cảnh báo tập trung tồn.<br><br>

      <b>🔎 Lọc theo loại</b><br>
      • <b>HC25 TK</b><br>
      • <b>HC25 TH</b><br>
      • <b>HC25 UCTT</b><br>
      • <b>TK HC25</b> — thứ tự không quan trọng.<br><br>

      <b>🔍 Tìm nhanh</b><br>
      Nhập 3–4 ký tự như <b>hc2</b>, <b>g05</b>, <b>ple</b> để tìm nhanh.<br><br>

      <b>💡 Có thể kết hợp</b><br>
      Mã hàng + loại + huyện/nhân viên.
      Ví dụ: <b>HC25 TK Pleiku</b>.
    `;

    return;
  }

  help.style.display = "none";

  const normalizedRaw = normalizeText(raw)
    .replace(/[-–—:;,/|+]+/g," ")
    .replace(/\s+/g," ")
    .trim();

  let words = normalizedRaw.split(" ").filter(Boolean);

  /* ===== LỆNH CHI TIẾT TỒN ===== */
  const wantsDetail =
    words.includes("chitiet") ||
    words.includes("chitietton") ||
    (words.includes("chi") && words.includes("tiet")) ||
    words.includes("danhsach");

  const wantsHuyen = words.includes("huyen");

  const wantsNhanVien =
    words.includes("nhanvien") ||
    (words.includes("nhan") && words.includes("vien")) ||
    words.includes("nv");

  words = words.filter(w =>
    !["chitiet","chitietton","danhsach","chi","tiet","huyen",
      "nhanvien","nhan","vien","nv","theo"].includes(w)
  );

  /* ===== NHẬN DIỆN CÁC TỪ ĐIỀU KHIỂN ===== */

  /* Tạm thời bỏ chức năng line. */

  let selectedType = "";

  if(words.includes("uctt")){
    selectedType = "uctt";
  }else if(words.includes("tk")){
    selectedType = "tk";
  }else if(words.includes("th")){
    selectedType = "th";
  }

  const searchWords = words.filter(word => {
    return word !== "tk" &&
           word !== "th" &&
           word !== "uctt" &&
           word !== "hang";
  });

  function isMaterialType(item,type){

    const loai = normalizeText(item.loaimh);

    if(type === "tk"){
      return loai.includes("trien khai");
    }

    if(type === "th"){
      return loai.includes("thu hoi");
    }

    if(type === "uctt"){
      return loai.includes("uctt");
    }

    return true;
  }

  /* ===== TÌM MẶT HÀNG ===== */

  const itemMatches = allData.filter(item => {

    const mh = normalizeText(item.mh);

    if(!searchWords.length) return true;

    return searchWords.every(token =>
      mh.includes(token)
    );

  }).filter(item => {

    return !selectedType ||
           isMaterialType(item,selectedType);

  });

  /*
    Khi người dùng nhập mã/tên mặt hàng, mặc định phân tích chuyên sâu.
    Nếu không tìm thấy theo tên mặt hàng thì chuyển sang tìm kiếm tổng quát.
  */
  const looksLikeItemQuery =
    searchWords.length > 0 &&
    itemMatches.length > 0;
  if(looksLikeItemQuery){

    const queryKeyword = searchWords.join(" ");

    if(wantsDetail){

      renderInventoryDetail(itemMatches,queryKeyword,selectedType);

    }else if(wantsHuyen){

      renderDimensionAnalysis(itemMatches,queryKeyword,selectedType,"huyen");

    }else if(wantsNhanVien){

      renderDimensionAnalysis(itemMatches,queryKeyword,selectedType,"nv");

    }else{

      renderItemAnalysis(itemMatches,queryKeyword,selectedType);

    }

    return;
  }

  /* ===== TÌM KIẾM TỔNG QUÁT ===== */

  const filtered = allData.filter(item => {

    if(
      selectedType &&
      !isMaterialType(item,selectedType)
    ){
      return false;
    }

    if(!searchWords.length){
      return true;
    }

    const searchableText = normalizeText([
      item.mh,
      item.dv,
      item.tt,
      item.sl,
      item.nv,
      item.huyen,
      item.loaimh
    ].join(" "));

    return searchWords.every(token =>
      searchableText.includes(token)
    );

  });

  renderBotResults(
    filtered,
    `🔎 Kết quả cho "${escapeHtml(raw)}"`
  );
}


/* ===== PHÂN TÍCH MẶT HÀNG ===== */

function renderInventoryDetail(data,keyword,selectedType){

  const result=document.getElementById("botResult");
  if(!data.length){
    result.innerHTML=`❌ Không tìm thấy tồn chi tiết cho <b>${escapeHtml(keyword)}</b>.`;
    return;
  }

  const total=data.reduce((sum,item)=>sum+Number(item.sl||0),0);
  let title=`📋 CHI TIẾT TỒN — ${escapeHtml(keyword.toUpperCase())}`;
  if(selectedType) title+=` — ${escapeHtml(typeName(selectedType))}`;

  let html=`
    <div class="analysis-title">${title}</div>
    <div class="analysis-summary">
      <div class="analysis-stat"><span>Tổng tồn</span><b>${formatNumber(total)}</b></div>
      <div class="analysis-stat"><span>Số dòng</span><b>${formatNumber(data.length)}</b></div>
      <div class="analysis-stat"><span>Huyện</span><b>${new Set(data.map(i=>String(i.huyen||"").trim()).filter(Boolean)).size}</b></div>
      <div class="analysis-stat"><span>Nhân viên</span><b>${new Set(data.map(i=>String(i.nv||"").trim()).filter(Boolean)).size}</b></div>
    </div>
    <div class="analysis-section"><b>📦 Danh sách tồn chi tiết</b><div class="bot-list">`;

  data.forEach((item,index)=>{
    html+=`<div class="bot-item">
      <div class="bot-item-main">
        <div class="bot-item-name">${index+1}. ${escapeHtml(item.mh||"Chưa xác định")}</div>

  const tk=data.filter(i=>isTypeForAnalysis(i,"tk"))
    .reduce((s,i)=>s+Number(i.sl||0),0);
  const th=data.filter(i=>isTypeForAnalysis(i,"th"))
    .reduce((s,i)=>s+Number(i.sl||0),0);
  const uctt=data.filter(i=>isTypeForAnalysis(i,"uctt"))
    .reduce((s,i)=>s+Number(i.sl||0),0);

    <div class="analysis-summary">
      <div class="analysis-stat">
        <span>Tổng tồn</span>
        <b>${formatNumber(total)}</b>
      </div>

      <div class="analysis-stat">
        <span>Chủng loại</span>
        <b>${groupList.length}</b>
      </div>

      <div class="analysis-stat">
        <span>Huyện</span>
        <b>${huyen.length}</b>
      </div>

      <b>📍 Phân bổ theo huyện</b>

      <div class="analysis-list">

          <div class="analysis-row">
            <span>

            </span>
            <strong>

              · ${percentage(x.total,total)}
            </strong>

                </strong>

function renderDeepType(code,name,value,total){

  const p=percentage(value,total);

  let level="Thấp";

  if(value/Math.max(total,1)>=.4){
    level="Cao";
  }else if(value/Math.max(total,1)>=.2){
    level="Đáng kể";
  }

  return `
    <div class="deep-type-card">
      <div class="deep-type-head">
        <strong>${code}</strong>
        <span>${level}</span>
      </div>

      <div class="deep-type-name">${name}</div>

      <div class="deep-type-value">
        ${formatNumber(value)}
      </div>

      <div class="deep-type-percent">
        ${p} tổng tồn
      </div>
    </div>
  `;
}


function buildDeepAssessment(
  data,
  total,
  groups,
  tk,
  th,
  uctt,
  huyen,
  nv,
  khoTotal,
  status
){

  const messages=[];

  if(!total) return "";

  /* 1. Cơ cấu TK/TH/UCTT */
  const typeValues=[
    {code:"TK",name:"Hàng triển khai",value:tk},
    {code:"TH",name:"Hàng thu hồi",value:th},
    {code:"UCTT",name:"Hàng UCTT",value:uctt}
  ].sort((a,b)=>b.value-a.value);

  const mainType=typeValues[0];

  messages.push(
    `Cơ cấu tồn lớn nhất là <b>${mainType.code}</b> (${mainType.name}) với <b>${formatNumber(mainType.value)}</b> bộ, chiếm <b>${percentage(mainType.value,total)}</b> tổng tồn.`
  );

  /* 2. Tồn TH */
  if(th>0){
    const p=th/total;

    messages.push(
      p>=.3
      ? `Hàng <b>TH</b> đang ở mức <b>${formatNumber(th)}</b> bộ (${percentage(th,total)}), tỷ trọng cao; nên ưu tiên rà soát hàng thu hồi chưa xử lý.`
      : `Hàng <b>TH</b> đang tồn <b>${formatNumber(th)}</b> bộ (${percentage(th,total)}).`
    );
  }else{
    messages.push(`Hàng <b>TH</b> hiện tồn <b>0</b> bộ.`);
  }

  /* 3. UCTT */
  if(uctt>0){
    const p=uctt/total;

    messages.push(
      p>=.3
      ? `Hàng <b>UCTT</b> tồn <b>${formatNumber(uctt)}</b> bộ (${percentage(uctt,total)}), tỷ trọng cao và cần theo dõi riêng.`
      : `Hàng <b>UCTT</b> tồn <b>${formatNumber(uctt)}</b> bộ (${percentage(uctt,total)}).`
    );
  }else{
    messages.push(`Hàng <b>UCTT</b> hiện tồn <b>0</b> bộ.`);
  }

  /* 4. Chủng loại tập trung */
  if(groups.length){

    const top=groups[0];
    const p=top.total/total;

    messages.push(
      `Chủng loại tồn nhiều nhất là <b>${escapeHtml(top.name)}</b>: <b>${formatNumber(top.total)}</b> bộ (${percentage(top.total,total)}).`+
      (p>=.5
        ? ` Đây là mức tập trung rất cao, cần ưu tiên kiểm tra riêng.`
        : p>=.3
          ? ` Đây là nhóm chiếm tỷ trọng đáng kể.`
          : "")
    );
  }

  /* 5. Huyện */
  if(huyen.length){

    const top=huyen[0];
    const p=top.total/total;

    messages.push(
      `Tồn tập trung nhiều nhất tại <b>${escapeHtml(top.name)}</b>: <b>${formatNumber(top.total)}</b> bộ (${percentage(top.total,total)})`+
      (p>=.4 ? ` — mức tập trung cao.` : ".")
    );
  }

  /* 6. Nhân viên */
  if(nv.length){

    const top=nv[0];
    const p=top.total/total;

    messages.push(
      `Nhân viên có tồn cao nhất là <b>${escapeHtml(top.name)}</b>: <b>${formatNumber(top.total)}</b> bộ (${percentage(top.total,total)})`+
      (p>=.25 ? ` — mức tập trung cao.` : ".")
    );
  }else{
    messages.push(`Không tính tồn tại <b>KHO GLI ĐÔNG/KHO GLI TÂY</b> vào chỉ tiêu nhân viên.`);
  }

  /* 7. Kho */
  if(khoTotal>0){

    messages.push(
      `Riêng tồn tại kho GLI Đông/Tây là <b>${formatNumber(khoTotal)}</b> bộ (${percentage(khoTotal,total)} tổng tồn), được theo dõi tách khỏi nhân viên.`
    );
  }

  /* 8. Trạng thái */
  if(status.length){

    const top=status[0];

    messages.push(
      `Trạng thái có số lượng lớn nhất là <b>${escapeHtml(top.name)}</b>: <b>${formatNumber(top.total)}</b> bộ (${percentage(top.total,total)}).`
    );
  }

  /* 9. Độ phân tán */
  if(groups.length>=5){

    messages.push(
      `Tồn đang phân tán trên <b>${groups.length}</b> chủng loại; nên ưu tiên kiểm tra các nhóm đứng đầu trước thay vì xem toàn bộ cùng lúc.`
    );

  }else if(groups.length>1){

    messages.push(
      `Có <b>${groups.length}</b> chủng loại khác nhau trong kết quả, bot đã tách riêng để tránh cộng gộp sai mã hàng.`
    );
  }

  return `
    <div class="analysis-section">
      <b>🧠 ĐÁNH GIÁ CHUYÊN SÂU</b>

      <div class="analysis-assessment deep-assessment">
        ${messages.map(x=>`<div>• ${x}</div>`).join("")}
      </div>
    </div>
  `;
}




function escapeJs(value){
  return String(value || "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\n/g,"\\n")
    .replace(/\r/g,"\\r");
}

function runBotCommand(command){

  const input=document.getElementById("botInput");

  input.value=command;

  runBot();

}

function renderProductGroupCard(group,index,grandTotal){
  const rows=group.rows;
  const tk=rows.filter(i=>isTypeForAnalysis(i,"tk")).reduce((s,i)=>s+Number(i.sl||0),0);
  const th=rows.filter(i=>isTypeForAnalysis(i,"th")).reduce((s,i)=>s+Number(i.sl||0),0);
  const uctt=rows.filter(i=>isTypeForAnalysis(i,"uctt")).reduce((s,i)=>s+Number(i.sl||0),0);
  const huyen=aggregateBy(rows,"huyen").slice(0,3), nv=aggregateBy(rows,"nv").slice(0,3);
  let note=`Cơ cấu: TK <b>${formatNumber(tk)}</b> · TH <b>${formatNumber(th)}</b> · UCTT <b>${formatNumber(uctt)}</b>.`;
  if(huyen.length) note+=` Huyện cao nhất: <b>${escapeHtml(huyen[0].name)}</b> — <b>${formatNumber(huyen[0].total)}</b>.`;
  if(nv.length) note+=` Nhân viên cao nhất: <b>${escapeHtml(nv[0].name)}</b> — <b>${formatNumber(nv[0].total)}</b>.`;
  return `<div class="product-analysis-card"><div class="product-analysis-head"><div class="product-analysis-name"><span class="product-index">${index+1}</span><strong>${escapeHtml(group.name)}</strong></div><div class="product-analysis-total">${formatNumber(group.total)}<small>${percentage(group.total,grandTotal)} tổng</small></div></div><div class="product-analysis-types"><div class="product-type"><b>TK</b><span>${formatNumber(tk)}</span></div><div class="product-type"><b>TH</b><span>${formatNumber(th)}</span></div><div class="product-type"><b>UCTT</b><span>${formatNumber(uctt)}</span></div></div><div class="product-analysis-meta">📍 <b>Huyện:</b> ${huyen.map(x=>`${escapeHtml(x.name)} (${formatNumber(x.total)})`).join(" · ")||"—"}<br>👤 <b>Nhân viên:</b> ${nv.map(x=>`${escapeHtml(x.name)} (${formatNumber(x.total)})`).join(" · ")||"—"}</div><div class="product-analysis-note">${note}</div></div>`;
}

function isTypeForAnalysis(item,type){

  const loai = normalizeText(item.loaimh);

  if(type === "tk") return loai.includes("trien khai");
  if(type === "th") return loai.includes("thu hoi");
  if(type === "uctt") return loai.includes("uctt");

  return false;
}


function typeName(type){

  return {
    tk:"Hàng triển khai",
    th:"Hàng thu hồi",
    uctt:"Hàng UCTT"
  }[type] || type;
}


function summarizeRows(rows){

  return {
    total: rows.reduce(
      (sum,item) => sum + Number(item.sl || 0),0
    ),
    lines: rows.length
  };

}


function aggregateBy(data,field){

  const map = new Map();

  data.forEach(item => {

    let name = String(item[field] || "").trim();

    if(field === "nv"){

      const kho = normalizeText(
        String(item.huyen || "") + " " + String(item.nv || "")
      );

      /* Kho GLI Đông/Tây và dòng nhân viên trống không tính vào nhân viên. */
      if(
        !name ||
        kho.includes("kho gli dong") ||
        kho.includes("kho gli tay")
      ){
        return;
      }
    }

    if(!name){
      name = "Chưa xác định";
    }

    const value = Number(item.sl || 0);

    if(!map.has(name)){
      map.set(name,{name:name,total:0,lines:0});
    }

    const obj=map.get(name);
    obj.total += value;
    obj.lines += 1;

  });

  return [...map.values()]
    .sort((a,b)=>b.total-a.total);

}

function formatNumber(value){

  return Number(value || 0).toLocaleString("vi-VN");

}


function percentage(value,total){

  if(!total) return "0.0%";

  return ((value / total) * 100).toFixed(1) + "%";

}


function analysisTypeCard(code,name,stats,total){

  return `
    <div class="analysis-type-card">
      <div>
        <strong>${code}</strong>
        <small>${name}</small>
      </div>

      <div class="analysis-type-number">
        ${formatNumber(stats.total)}
        <small>${stats.lines} line · ${percentage(stats.total,total)}</small>
      </div>
    </div>
  `;

}


function buildAnalysisAssessment(
  data,
  total,
  typeStats,
  topHuyen,
  topNV
){

  const messages = [];

  if(!total){
    return "";
  }

  /* Cơ cấu loại hàng — luôn ghi rõ số lượng */
  if(typeStats.tk.total > 0){

    const p = typeStats.tk.total / total;

    messages.push(
      `TK (Hàng triển khai) đang tồn <b>${formatNumber(typeStats.tk.total)}</b> bộ, <b>${typeStats.tk.lines}</b> line, chiếm <b>${percentage(typeStats.tk.total,total)}</b> tổng tồn.`
    );

  }

  if(typeStats.th.total > 0){

    const p = typeStats.th.total / total;

    messages.push(
      `TH (Hàng thu hồi) đang tồn <b>${formatNumber(typeStats.th.total)}</b> bộ, <b>${typeStats.th.lines}</b> line, chiếm <b>${percentage(typeStats.th.total,total)}</b> tổng tồn${p >= .3 ? "; tỷ trọng TH khá cao, nên ưu tiên rà soát thu hồi/xử lý." : "."}`
    );

  }else{

    messages.push(
      `TH (Hàng thu hồi): <b>0</b> bộ, <b>0</b> line.`
    );

  }

  if(typeStats.uctt.total > 0){

    const p = typeStats.uctt.total / total;

    messages.push(
      `UCTT đang tồn <b>${formatNumber(typeStats.uctt.total)}</b> bộ, <b>${typeStats.uctt.lines}</b> line, chiếm <b>${percentage(typeStats.uctt.total,total)}</b> tổng tồn${p >= .3 ? "; tỷ trọng đáng kể, cần theo dõi riêng." : "."}`
    );

  }

  /* Tập trung theo huyện — luôn ghi số lượng của huyện đứng đầu */
  if(topHuyen.length && total > 0){

    const p = topHuyen[0].total / total;

    messages.push(
      `Huyện tồn nhiều nhất là <b>${escapeHtml(topHuyen[0].name)}</b>: <b>${formatNumber(topHuyen[0].total)}</b> bộ / <b>${topHuyen[0].lines}</b> line, chiếm <b>${percentage(topHuyen[0].total,total)}</b>${p >= .4 ? " — mức tập trung cao." : "."}`
    );

  }

  /* Tập trung theo nhân viên — luôn ghi số lượng */
  if(topNV.length && total > 0){

    const p = topNV[0].total / total;

    messages.push(
      `Nhân viên tồn nhiều nhất là <b>${escapeHtml(topNV[0].name)}</b>: <b>${formatNumber(topNV[0].total)}</b> bộ / <b>${topNV[0].lines}</b> line, chiếm <b>${percentage(topNV[0].total,total)}</b>${p >= .25 ? " — mức tập trung cao." : "."}`
    );

  }

  if(!messages.length){

    messages.push(
      `Tổng tồn <b>${formatNumber(total)}</b> bộ trên <b>${data.length}</b> line; chưa phát hiện điểm tập trung quá cao theo các tiêu chí hiện có.`
    );

  }

  return `
    <div class="analysis-section">
      <b>🧠 Đánh giá</b>
      <div class="analysis-assessment">
        ${messages.map(x => `<div>• ${x}</div>`).join("")}
      </div>
    </div>
  `;

}


/* ===== TỒN LINE ===== */

function renderLineResults(data,title){

  const result = document.getElementById("botResult");

  if(!data.length){

    result.innerHTML = `
      <b>${title}</b><br><br>
      ❌ Không có line phù hợp.
    `;

    return;
  }

  const total = data.reduce(
    (sum,item) => sum + Number(item.sl || 0),0
  );

  let html = `
    <b>${title}</b><br>
    <span style="color:#607d8b">
      ${data.length} line · Tổng tồn <b>${formatNumber(total)}</b>
    </span>

    <div class="bot-list">
  `;

  data.forEach((item,index) => {

    html += `
      <div class="bot-item">

        <div class="bot-item-main">

          <div class="bot-item-name">
            ${index + 1}. ${escapeHtml(item.mh || "Không có tên")}
          </div>

          </div>

        </div>

        <div class="bot-item-info">

          <span class="bot-tag">
            📦 ${escapeHtml(item.dv || "—")}
          </span>

          <span class="bot-tag">
            👤 ${escapeHtml(item.nv || "—")}
          </span>

          <span class="bot-tag">
            📍 ${escapeHtml(item.huyen || "—")}
          </span>

          <span class="bot-tag">
            🏷️ ${escapeHtml(item.loaimh || "—")}
          </span>

        </div>

      </div>
    `;

  });

  html += `</div>`;

  result.innerHTML = html;
}


function renderBotResults(data,title){

  const result = document.getElementById("botResult");

  if(!data.length){

    result.innerHTML = `
      <b>${title}</b><br><br>
      ❌ Không tìm thấy dữ liệu phù hợp.<br>
      Thử từ khóa khác hoặc nhập <b>/help</b>.
    `;

    return;
  }

  const showData = data.slice(0,50);

  let totalSL = 0;

  data.forEach(item => {
    totalSL += Number(item.sl || 0);
  });

  let html = `
    <b>${title}</b><br>
    Tìm thấy <b>${data.length.toLocaleString("vi-VN")}</b> bản ghi
    — tổng số lượng <b>${totalSL.toLocaleString("vi-VN")}</b>.
  `;

  if(data.length > 50){
    html += `<br><span style="color:#78909c">
      Đang hiển thị 50 kết quả đầu tiên.
    </span>`;
  }

  html += `<div class="bot-list">`;

  showData.forEach(item => {

    html += `
      <div class="bot-item">

        <div class="bot-item-main">

          <div class="bot-item-name">
            ${escapeHtml(item.mh || "Không có tên mặt hàng")}
          </div>

          <div class="bot-item-sl">
            SL: ${escapeHtml(item.sl ?? 0)}
          </div>

        </div>

        <div class="bot-item-info">

          <span class="bot-tag">
            📦 ${escapeHtml(item.dv || "—")}
          </span>

          <span class="bot-tag">
            👤 ${escapeHtml(item.nv || "—")}
          </span>

          <span class="bot-tag">
            📍 ${escapeHtml(item.huyen || "—")}
          </span>

          <span class="bot-tag">
            🏷️ ${escapeHtml(item.tt || "—")}
          </span>

        </div>

      </div>
    `;

  });

  html += `</div>`;

  result.innerHTML = html;
}
