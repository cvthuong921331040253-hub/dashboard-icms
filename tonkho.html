<!DOCTYPE html>
<html lang="vi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kho vật tư</title>

<!-- Thư viện tạo Excel trực tiếp từ dữ liệu đang có trên giao diện -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fa;
  color:#263238;
}

/* ===== LOADING ===== */
#pageLoader{
  position:fixed;
  inset:0;
  z-index:99999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:14px;
  background:rgba(243,246,250,.78);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
  transition:opacity .35s ease, visibility .35s ease;
}

#pageLoader.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loader-spinner{
  width:46px;
  height:46px;
  border:4px solid #dbe5f0;
  border-top-color:#1976d2;
  border-right-color:#42a5f5;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

.loader-text{
  color:#546e7a;
  font-size:13px;
  font-weight:600;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

/* ===== HEADER ===== */
.sticky-top{
  position:sticky;
  top:0;
  z-index:999;
  background:rgba(243,246,250,.96);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  padding:10px;
}

.header-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

h2{
  margin:0;
  font-size:21px;
  color:#263238;
  letter-spacing:.2px;
}

.update-time{
  color:#78909c;
  margin:4px 0 9px;
  font-size:11px;
}

/* ===== BUTTON ===== */
button{
  border:none;
  background:#1976d2;
  color:white;
  border-radius:7px;
  cursor:pointer;
  transition:.18s ease;
}

button:hover{
  filter:brightness(.96);
  transform:translateY(-1px);
}

.excel-btn{
  min-height:34px;
  padding:0 13px;
  background:#2e7d32;
  font-size:12px;
  font-weight:600;
  box-shadow:0 2px 5px rgba(46,125,50,.18);
}

/* ===== STATS ===== */
.mini-stats{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.mini-stat{
  flex:1;
  background:white;
  border:1px solid #e5ebf1;
  border-radius:10px;
  padding:9px 12px;
  box-shadow:0 2px 8px rgba(31,45,61,.06);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.mini-stat span{
  font-size:12px;
  color:#607d8b;
}

.mini-stat b{
  font-size:16px;
  color:#263238;
}

/* ===== FILTER CARD ===== */
.card{
  background:white;
  border:1px solid #e5ebf1;
  border-radius:11px;
  padding:10px;
  margin-bottom:10px;
  box-shadow:0 2px 8px rgba(31,45,61,.06);
}

.topbar{
  display:grid;
  grid-template-columns:1.3fr 1.1fr 1fr 1.15fr;
  gap:8px;
}

input,select{
  width:100%;
  min-height:36px;
  padding:8px 10px;
  border:1px solid #d5dee7;
  border-radius:7px;
  background:#fff;
  color:#37474f;
  outline:none;
  transition:border-color .18s, box-shadow .18s;
}

input::placeholder{
  color:#90a4ae;
}

input:focus,select:focus{
  border-color:#64b5f6;
  box-shadow:0 0 0 3px rgba(33,150,243,.10);
}


/* ===== PHÂN TÍCH BOT ===== */
.analysis-title{
  font-size:14px;
  font-weight:700;
  color:#263238;
  margin-bottom:8px;
}

.analysis-summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin:8px 0 10px;
}

.analysis-stat{
  background:white;
  border:1px solid #e1e8ef;
  border-radius:8px;
  padding:7px;
  text-align:center;
}

.analysis-stat span{
  display:block;
  font-size:10px;
  color:#78909c;
  margin-bottom:3px;
}

.analysis-stat b{
  font-size:13px;
  color:#1976d2;
}

.analysis-section{
  margin-top:10px;
}

.analysis-section > b{
  display:block;
  margin-bottom:6px;
  color:#455a64;
}

.analysis-list{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.analysis-type-card,
.analysis-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:white;
  border:1px solid #e1e8ef;
  border-radius:8px;
  padding:7px 9px;
}

.analysis-type-card > div:first-child{
  display:flex;
  align-items:center;
  gap:7px;
}

.analysis-type-card strong{
  color:#1976d2;
  font-size:12px;
}

.analysis-type-card small,
.analysis-type-number small{
  display:block;
  font-size:10px;
  color:#78909c;
}

.analysis-type-number{
  text-align:right;
  font-size:13px;
  font-weight:700;
}

.analysis-row{
  font-size:11px;
}

.analysis-row strong{
  color:#1976d2;
  white-space:nowrap;
}

.analysis-assessment{
  background:#f7fafc;
  border:1px solid #e1e8ef;
  border-radius:8px;
  padding:8px 9px;
  font-size:11px;
  line-height:1.5;
  color:#455a64;
}

.analysis-hint{
  margin-top:10px;
  padding:7px 8px;
  border-radius:7px;
  background:#eef6ff;
  color:#607d8b;
  font-size:10.5px;
  line-height:1.4;
}

@media(max-width:768px){

  .analysis-summary{
    grid-template-columns:repeat(2,1fr);
  }

  .analysis-stat{
    padding:6px;
  }

  .analysis-stat b{
    font-size:12px;
  }

}


/* ===== BOT NỔI / CỬA SỔ CHAT ===== */
.bot-fab{
  position:fixed !important;
  right:16px !important;
  bottom:16px !important;
  z-index:3000;
  width:50px;
  height:50px;
  padding:0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  background:#1976d2;
  color:#fff;
  box-shadow:0 5px 18px rgba(25,118,210,.30);
  border:2px solid rgba(255,255,255,.9);
}

.bot-fab:hover{
  transform:translateY(-2px);
}

.bot-panel{
  position:fixed !important;
  right:16px !important;
  bottom:78px !important;
  z-index:2999;
  width:390px;
  max-width:calc(100vw - 24px);
  height:min(620px,calc(100vh - 100px));
  display:none;
  flex-direction:column;
  overflow:hidden;
  background:#f5f8fb;
  border:1px solid #d6e0e8;
  border-radius:14px;
  box-shadow:0 10px 35px rgba(31,45,61,.22);
}

.bot-panel.open{
  display:flex;
  animation:botOpen .18s ease-out;
}

@keyframes botOpen{
  from{
    opacity:0;
    transform:translateY(8px) scale(.98);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.bot-panel-header{
  min-height:52px;
  padding:9px 11px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#1976d2;
  color:white;
}

.bot-panel-header strong{
  display:block;
  font-size:14px;
}

.bot-panel-header small{
  display:block;
  margin-top:2px;
  font-size:10px;
  opacity:.82;
}

.bot-close{
  width:32px;
  height:32px;
  padding:0;
  border-radius:50%;
  background:rgba(255,255,255,.16);
  font-size:23px;
  line-height:1;
}

.bot-panel-body{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  padding:9px;
}

.bot-input-row{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

#botInput{
  flex:1;
  min-width:0;
}

.bot-send{
  min-width:58px;
  padding:0 10px;
  font-size:12px;
  font-weight:600;
}

.bot-help{
  margin:7px 2px;
  color:#607d8b;
  font-size:10.5px;
  line-height:1.4;
  flex-shrink:0;
}

.bot-result{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:8px;
  border-radius:9px;
  background:#eef3f7;
  border:1px solid #dce5ec;
  font-size:12px;
  line-height:1.45;
  color:#455a64;
}

.bot-result:empty{
  display:block;
}

.bot-result b{
  color:#263238;
}

.bot-list{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:8px;
}

.bot-item{
  background:white;
  border:1px solid #e1e8ef;
  border-radius:8px;
  padding:8px 9px;
  box-shadow:0 1px 3px rgba(31,45,61,.04);
}

.bot-item-main{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
}

.bot-item-name{
  flex:1;
  min-width:0;
  font-size:12px;
  font-weight:700;
  color:#263238;
  line-height:1.3;
  word-break:break-word;
}

.bot-item-sl{
  flex-shrink:0;
  font-size:13px;
  font-weight:700;
  color:#1976d2;
  white-space:nowrap;
}

.bot-item-info{
  display:flex;
  flex-wrap:wrap;
  gap:3px 10px;
  margin-top:4px;
  color:#607d8b;
  font-size:10.5px;
  line-height:1.35;
}

.bot-tag{
  display:inline-block;
}

@media(max-width:768px){

  .bot-fab{
    right:12px !important;
    bottom:12px !important;
    width:46px;
    height:46px;
    font-size:21px;
  }

  .bot-panel{
    right:8px !important;
    bottom:66px !important;
    width:calc(100vw - 16px);
    max-width:none;
    height:min(76vh,620px);
    border-radius:13px;
  }

  .bot-panel-header{
    min-height:48px;
  }

  .bot-panel-body{
    padding:7px;
  }

  .bot-result{
    padding:7px;
  }

  .bot-item{
    padding:8px;
  }

}


/* ===== TABLE ===== */
.table-wrap{
  height:calc(100vh - 180px);
  min-height:300px;
  overflow:auto;
  background:white;
  border:1px solid #d6e0e8;
  border-radius:11px;
  box-shadow:0 2px 9px rgba(31,45,61,.07);
  overflow:auto;
}

table{
  width:auto;
  min-width:100%;
  border-collapse:separate;
  border-spacing:0;
  table-layout:auto;
}

thead th{
  background:#1976d2;
  color:white;
  position:sticky;
  top:0;
  z-index:10;
  font-weight:600;
  box-shadow:0 1px 0 rgba(0,0,0,.08);
}

th,td{
  padding:8px 10px;
  border-right:1px solid #e2e8ee;
  border-bottom:1px solid #e5ebf0;
  font-size:13px;
  vertical-align:middle;
  text-align:left;
}

thead th:first-child{
  border-top-left-radius:10px;
}

tbody tr:nth-child(even){
  background:#f7faff;
}

tbody tr:nth-child(odd){
  background:#fff;
}

tbody tr:hover{
  background:#eaf3ff;
}

tbody tr:active{
  background:#dbeaff;
}

th:not(:first-child),
td:not(:first-child){
  white-space:nowrap;
}

/* Cột mặt hàng cố định */
thead th:first-child{
  left:0;
  z-index:20;
  min-width:145px;
  max-width:240px;
  white-space:normal;
  word-break:break-word;
  line-height:1.25;
}

tbody td:first-child{
  position:sticky;
  left:0;
  z-index:5;
  min-width:145px;
  max-width:240px;
  white-space:normal;
  word-break:break-word;
  line-height:1.3;
  font-weight:600;
}

/* Nền của cột sticky phải theo từng dòng */
tbody tr:nth-child(even) td:first-child{
  background:#f7faff;
}

tbody tr:nth-child(odd) td:first-child{
  background:#fff;
}

tbody tr:hover td:first-child{
  background:#eaf3ff;
}

td.sl-cell{
  text-align:right;
  font-weight:700;
}

.loading{
  padding:30px !important;
  text-align:center !important;
  color:#78909c;
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){

  .sticky-top{
    padding:6px;
  }

  h2{
    font-size:19px;
  }

  .excel-btn{
    min-height:32px;
    padding:0 10px;
    font-size:11px;
  }

  .mini-stats{
    gap:6px;
  }

  .mini-stat{
    padding:8px 10px;
  }

  .mini-stat span{
    font-size:11px;
  }

  .mini-stat b{
    font-size:15px;
  }

  .topbar{
    grid-template-columns:1fr 1fr;
    gap:6px;
  }

  input,select{
    min-height:34px;
    font-size:12px;
  }

  table{
    min-width:100%;
  }

  th,td{
    font-size:12px;
    padding:6px;
  }

  thead th:first-child,
  tbody td:first-child{
    min-width:105px;
    max-width:105px;
  }

  th:nth-child(2),
  td:nth-child(2){
    min-width:42px;
  }

  th:nth-child(3),
  td:nth-child(3){
    min-width:38px;
  }

  th:nth-child(4),
  td:nth-child(4){
    min-width:105px;
    max-width:125px;
    white-space:normal;
    word-break:break-word;
    line-height:1.2;
  }

  th:nth-child(5),
  td:nth-child(5){
    min-width:55px;
    max-width:70px;
    white-space:normal;
    word-break:break-word;
    line-height:1.2;
  }

  .table-wrap{
    height:calc(100vh - 205px);
  }
}
</style>
</head>

<body>

<!-- Màn hình loading -->
<div id="pageLoader">
  <div class="loader-spinner"></div>
  <div class="loader-text">Đang tải dữ liệu kho...</div>
</div>

<div class="sticky-top">

  <div class="header-row">
    <h2>📦 KHO VẬT TƯ</h2>

    <button
      class="excel-btn"
      onclick="downloadExcel()">
      Tải file Excel
    </button>
  </div>

  <div class="update-time">
    Cập nhật: <span id="lastUpdate">--</span>
  </div>


  <div class="mini-stats">

    <div class="mini-stat">
      <span>Tổng bản ghi</span>
      <b id="tong">0</b>
    </div>

    <div class="mini-stat">
      <span>Tổng số lượng</span>
      <b id="tongsl">0</b>
    </div>

  </div>

  <div class="card">
    <div class="topbar">

      <input
        type="text"
        id="search"
        placeholder="🔎 Tìm mặt hàng...">

      <input
        type="text"
        id="searchNV"
        placeholder="👤 Tìm nhân viên...">

      <select id="huyenFilter">
        <option value="">Tất cả huyện</option>
      </select>

      <select id="loaiFilter">
        <option value="">Tất cả loại mặt hàng</option>
      </select>

    </div>
  </div>

</div>

  <!-- BOT NỔI -->
  <button
    type="button"
    id="botFab"
    class="bot-fab"
    onclick="toggleBot()"
    aria-label="Mở bot tra cứu">
    🤖
  </button>

  <div id="botPanel" class="bot-panel">

    <div class="bot-panel-header">
      <div>
        <strong>🤖 Bot tra cứu kho</strong>
        <small>TK · TH · UCTT</small>
      </div>

      <button
        type="button"
        class="bot-close"
        onclick="toggleBot()"
        aria-label="Đóng bot">
        ×
      </button>
    </div>

    <div class="bot-panel-body">

      <div class="bot-input-row">
        <input
          type="text"
          id="botInput"
          placeholder='Ví dụ: HC25, HC25 TK, HC25 line'>
        <button
          type="button"
          class="bot-send"
          onclick="runBot()">
          Gửi
        </button>
      </div>

      <div id="botHelp" class="bot-help">
        Nhập <b>/help</b> để xem lệnh. Có thể hỏi trực tiếp mã/tên vật tư.
      </div>

      <div id="botResult" class="bot-result"></div>

    </div>

  </div>


<div class="table-wrap">

  <table>
    <thead>
      <tr>
        <th>Mặt hàng</th>
        <th>ĐVT</th>
        <th>SL</th>
        <th>Nhân viên</th>
        <th>Huyện</th>
      </tr>
    </thead>

    <tbody id="tbody">
      <tr>
        <td colspan="5" class="loading">
          ⏳ Đang tải dữ liệu...
        </td>
      </tr>
    </tbody>
  </table>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyqb1Qf8YHiaPvlFKAX872-o6sf6a_GcQCy_2l9poMeYXyePFEjKnxTtpJHImaAQ0JTVg/exec?sheet=Data%20kho";

let allData = [];
let currentData = [];

/* ===== LOAD DATA ===== */

async function loadData(){

  try{

    const res = await fetch(API_URL);
    const json = await res.json();

    allData = json.data || [];

    allData.sort((a,b) => {
      return Number(b.sl || 0) - Number(a.sl || 0);
    });

    currentData = [...allData];

    renderTable(currentData);
    renderStats(currentData);
    renderHuyen(allData);
    renderLoaiMH(allData);

    /* Hiện giao diện sau khi tải xong */
    hideLoader();

  }catch(err){

    document.getElementById("tbody").innerHTML = `
      <tr>
        <td colspan="5" class="loading">
          ❌ Lỗi tải dữ liệu
        </td>
      </tr>
    `;

    console.log(err);

    /* Không để màn hình loading bị treo */
    hideLoader();

  }
}

/* ===== HIDE LOADER ===== */

function hideLoader(){

  const loader = document.getElementById("pageLoader");

  setTimeout(() => {
    loader.classList.add("hide");
  }, 180);

}

/* ===== TABLE ===== */

function renderTable(data){

  if(data.length === 0){

    document.getElementById("tbody").innerHTML = `
      <tr>
        <td colspan="5" class="loading">
          Không có dữ liệu
        </td>
      </tr>
    `;

    document.getElementById("lastUpdate").innerText = "--";

    return;
  }

  let html = "";

  data.forEach(item => {

    html += `
      <tr>
        <td>${escapeHtml(item.mh || "")}</td>
        <td>${escapeHtml(item.dv || "")}</td>
        <td class="sl-cell">${escapeHtml(item.sl ?? 0)}</td>
        <td>${escapeHtml(item.nv || "")}</td>
        <td>${escapeHtml(item.huyen || "")}</td>
      </tr>
    `;

  });

  document.getElementById("tbody").innerHTML = html;

  let last = data[0].tg || "--";

  document.getElementById("lastUpdate").innerText = last;
}

/* ===== ESCAPE HTML ===== */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* ===== STATS ===== */

function renderStats(data){

  document.getElementById("tong").innerText =
    data.length.toLocaleString("vi-VN");

  let tongsl = 0;

  data.forEach(i => {
    tongsl += Number(i.sl || 0);
  });

  document.getElementById("tongsl").innerText =
    tongsl.toLocaleString("vi-VN");
}

/* ===== HUYỆN ===== */

function renderHuyen(data){

  let arr = [...new Set(
    data.map(i => i.huyen).filter(Boolean)
  )];

  arr.sort();

  let html =
    `<option value="">Tất cả huyện</option>`;

  arr.forEach(h => {

    html += `
      <option value="${escapeHtml(h)}">
        ${escapeHtml(h)}
      </option>
    `;

  });

  document.getElementById("huyenFilter").innerHTML =
    html;
}

/* ===== LOẠI MẶT HÀNG ===== */

function renderLoaiMH(data){

  let arr = [...new Set(
    data.map(i => i.loaimh).filter(Boolean)
  )];

  arr.sort();

  let html =
    `<option value="">Tất cả loại mặt hàng</option>`;

  arr.forEach(loai => {

    html += `
      <option value="${escapeHtml(loai)}">
        ${escapeHtml(loai)}
      </option>
    `;

  });

  document.getElementById("loaiFilter").innerHTML =
    html;
}

/* ===== FILTER ===== */

function filterData(){

  let keyword =
    document.getElementById("search")
    .value
    .toLowerCase()
    .trim();

  let keywordNV =
    document.getElementById("searchNV")
    .value
    .toLowerCase()
    .trim();

  let huyen =
    document.getElementById("huyenFilter")
    .value;

  let loai =
    document.getElementById("loaiFilter")
    .value;

  currentData = allData.filter(i => {

    let okSearch =
      String(i.mh || "")
      .toLowerCase()
      .includes(keyword);

    let okNV =
      String(i.nv || "")
      .toLowerCase()
      .includes(keywordNV);

    let okHuyen =
      !huyen || i.huyen === huyen;

    let okLoai =
      !loai || i.loaimh === loai;

    return okSearch && okNV && okHuyen && okLoai;

  });

  renderTable(currentData);
  renderStats(currentData);
}

/* ===== EXCEL ===== */

function downloadExcel(){

  if(!currentData.length){

    alert("Không có dữ liệu để tải Excel.");
    return;

  }

  const excelData = currentData.map(item => ({
    "Mặt hàng": item.mh || "",
    "Đơn vị": item.dv || "",
    "Trạng thái": item.tt || "",
    "Số lượng": Number(item.sl || 0),
    "Nhân viên": item.nv || "",
    "Huyện": item.huyen || "",
    "Loại mặt hàng": item.loaimh || ""
  }));

  const ws = XLSX.utils.json_to_sheet(excelData);

  const header = [
    "Mặt hàng",
    "Đơn vị",
    "Trạng thái",
    "Số lượng",
    "Nhân viên",
    "Huyện",
    "Loại mặt hàng"
  ];

  header.forEach((text,index) => {

    const cell = ws[XLSX.utils.encode_cell({
      r:0,
      c:index
    })];

    if(cell){

      cell.s = {
        font:{
          bold:true,
          color:"FFFFFF",
          sz:11
        },
        fill:{
          patternType:"solid",
          fgColor:{
            rgb:"1976D2"
          }
        },
        alignment:{
          horizontal:"center",
          vertical:"center",
          wrapText:true
        },
        border:{
          top:{style:"thin",color:{rgb:"D9E2EC"}},
          bottom:{style:"thin",color:{rgb:"D9E2EC"}},
          left:{style:"thin",color:{rgb:"D9E2EC"}},
          right:{style:"thin",color:{rgb:"D9E2EC"}}
        }
      };

    }

  });

  const widths = header.map(title => {

    let maxLength = title.length;

    excelData.forEach(row => {

      maxLength = Math.max(
        maxLength,
        String(row[title] ?? "").length
      );

    });

    return {
      wch:Math.min(
        Math.max(maxLength + 2,10),
        40
      )
    };

  });

  ws["!cols"] = widths;

  ws["!rows"] = [
    {hpt:24}
  ];

  ws["!freeze"] = {
    xSplit:0,
    ySplit:1
  };

  ws["!autofilter"] = {
    ref:`A1:G${excelData.length + 1}`
  };

  const centerCols = [1,2,4,5];

  for(let r = 1; r <= excelData.length; r++){

    centerCols.forEach(c => {

      const cell =
        ws[XLSX.utils.encode_cell({
          r:r,
          c:c
        })];

      if(cell){

        cell.s = {
          alignment:{
            horizontal:"center",
            vertical:"center",
            wrapText:true
          }
        };

      }

    });

    const slCell =
      ws[XLSX.utils.encode_cell({
        r:r,
        c:3
      })];

    if(slCell){

      slCell.s = {
        font:{
          bold:true
        },
        alignment:{
          horizontal:"right",
          vertical:"center"
        },
        numFmt:'#,##0'
      };

    }

  }

  const wb = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "Kho vật tư"
  );

  const now = new Date();

  const date =
    String(now.getDate()).padStart(2,"0") +
    String(now.getMonth()+1).padStart(2,"0") +
    now.getFullYear();

  const time =
    String(now.getHours()).padStart(2,"0") +
    String(now.getMinutes()).padStart(2,"0");

  const fileName =
    `Kho_vat_tu_${date}_${time}.xlsx`;

  /*
    Xuất thành ArrayBuffer rồi tạo Blob.
    Cách này ổn định hơn window.open() trên trình duyệt mobile,
    tránh trường hợp hệ thống lưu file Excel thành .bin.
  */
  const excelBuffer = XLSX.write(wb, {
    bookType:"xlsx",
    type:"array"
  });

  const blob = new Blob(
    [excelBuffer],
    {
      type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
    }
  );

  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");

  link.href = url;
  link.download = fileName;
  link.style.display = "none";

  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(() => {
    URL.revokeObjectURL(url);
  }, 3000);

}

/* ===== BOT TRA CỨU ===== */

function normalizeText(value){
  return String(value || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .trim();
}


function toggleBot(){

  const panel = document.getElementById("botPanel");
  const input = document.getElementById("botInput");

  panel.classList.toggle("open");

  if(panel.classList.contains("open")){
    setTimeout(() => input.focus(), 80);
  }

}

function runBot(){

  const input = document.getElementById("botInput");
  const result = document.getElementById("botResult");
  const help = document.getElementById("botHelp");

  const raw = input.value.trim();

  if(!raw){
    result.innerHTML =
      "⚠️ Nhập <b>/help</b> hoặc tên/mã mặt hàng cần tra cứu.";
    return;
  }

  if(normalizeText(raw) === "/help"){

    help.style.display = "none";

    result.innerHTML = `
      <b>📖 HƯỚNG DẪN BOT KHO</b><br><br>

      <b>📦 Quy ước loại hàng</b><br>
      • <b>TK</b> → Hàng triển khai<br>
      • <b>TH</b> → Hàng thu hồi<br>
      • <b>UCTT</b> → Hàng UCTT<br><br>

      <b>📊 Phân tích mặt hàng</b><br>
      Chỉ cần nhập mã/tên, ví dụ: <b>HC25</b>.<br>
      Bot tự tổng hợp tổng tồn, số line, TK/TH/UCTT,
      huyện, nhân viên và cảnh báo tập trung tồn.<br><br>

      <b>🔎 Lọc theo loại</b><br>
      • <b>HC25 TK</b><br>
      • <b>HC25 TH</b><br>
      • <b>HC25 UCTT</b><br>
      • <b>TK HC25</b> — thứ tự không quan trọng.<br><br>

      <b>📋 Xem tồn line</b><br>
      • <b>HC25 line</b><br>
      • <b>HC25 TK line</b><br>
      • <b>HC25 UCTT line</b><br><br>

      <b>🔍 Tìm nhanh</b><br>
      Nhập 3–4 ký tự như <b>hc2</b>, <b>g05</b>, <b>ple</b> để tìm nhanh.<br><br>

      <b>💡 Có thể kết hợp</b><br>
      Mã hàng + loại + huyện/nhân viên.
      Ví dụ: <b>HC25 TK Pleiku</b>.
    `;

    return;
  }

  help.style.display = "none";

  const normalizedRaw = normalizeText(raw)
    .replace(/[-–—:;,/|+]+/g," ")
    .replace(/\s+/g," ")
    .trim();

  let words = normalizedRaw.split(" ").filter(Boolean);

  /* ===== NHẬN DIỆN CÁC TỪ ĐIỀU KHIỂN ===== */

  const wantsLine = words.includes("line") ||
                    words.includes("lines") ||
                    words.includes("dong") ||
                    words.includes("dongton");

  words = words.filter(w =>
    !["line","lines","dong","dongton"].includes(w)
  );

  let selectedType = "";

  if(words.includes("uctt")){
    selectedType = "uctt";
  }else if(words.includes("tk")){
    selectedType = "tk";
  }else if(words.includes("th")){
    selectedType = "th";
  }

  const searchWords = words.filter(word => {
    return word !== "tk" &&
           word !== "th" &&
           word !== "uctt" &&
           word !== "hang";
  });

  function isMaterialType(item,type){

    const loai = normalizeText(item.loaimh);

    if(type === "tk"){
      return loai.includes("trien khai");
    }

    if(type === "th"){
      return loai.includes("thu hoi");
    }

    if(type === "uctt"){
      return loai.includes("uctt");
    }

    return true;
  }

  /* ===== TÌM MẶT HÀNG ===== */

  const itemMatches = allData.filter(item => {

    const mh = normalizeText(item.mh);

    if(!searchWords.length) return true;

    return searchWords.every(token =>
      mh.includes(token)
    );

  }).filter(item => {

    return !selectedType ||
           isMaterialType(item,selectedType);

  });

  /*
    Nếu câu hỏi có từ "line" hoặc nhận diện rõ là mặt hàng,
    hiển thị chi tiết line.
  */
  const looksLikeItemQuery =
    searchWords.length > 0 &&
    itemMatches.length > 0;

  if(wantsLine && looksLikeItemQuery){

    renderLineResults(
      itemMatches,
      `📋 Tồn line — ${escapeHtml(raw)}`
    );

    return;
  }

  /*
    Khi người dùng nhập mã/tên mặt hàng, mặc định phân tích chuyên sâu.
    Nếu không tìm thấy theo tên mặt hàng thì chuyển sang tìm kiếm tổng quát.
  */
  if(looksLikeItemQuery){

    renderItemAnalysis(
      itemMatches,
      searchWords.join(" "),
      selectedType
    );

    return;
  }

  /* ===== TÌM KIẾM TỔNG QUÁT ===== */

  const filtered = allData.filter(item => {

    if(
      selectedType &&
      !isMaterialType(item,selectedType)
    ){
      return false;
    }

    if(!searchWords.length){
      return true;
    }

    const searchableText = normalizeText([
      item.mh,
      item.dv,
      item.tt,
      item.sl,
      item.nv,
      item.huyen,
      item.loaimh
    ].join(" "));

    return searchWords.every(token =>
      searchableText.includes(token)
    );

  });

  renderBotResults(
    filtered,
    `🔎 Kết quả cho "${escapeHtml(raw)}"`
  );
}


/* ===== PHÂN TÍCH MẶT HÀNG ===== */

function renderItemAnalysis(data,keyword,selectedType){

  const result = document.getElementById("botResult");

  if(!data.length){
    result.innerHTML = `
      ❌ Không tìm thấy mặt hàng <b>${escapeHtml(keyword)}</b>.
    `;
    return;
  }

  const total = data.reduce(
    (sum,item) => sum + Number(item.sl || 0),0
  );

  const lineCount = data.length;

  const types = {
    tk: data.filter(i => isTypeForAnalysis(i,"tk")),
    th: data.filter(i => isTypeForAnalysis(i,"th")),
    uctt: data.filter(i => isTypeForAnalysis(i,"uctt"))
  };

  const typeStats = {
    tk: summarizeRows(types.tk),
    th: summarizeRows(types.th),
    uctt: summarizeRows(types.uctt)
  };

  const huyen = aggregateBy(data,"huyen");
  const nv = aggregateBy(data,"nv");

  const topHuyen = huyen.slice(0,5);
  const topNV = nv.slice(0,5);

  let title = `📦 PHÂN TÍCH ${escapeHtml(keyword.toUpperCase())}`;

  if(selectedType){
    title += ` — ${escapeHtml(typeName(selectedType))}`;
  }

  let html = `
    <div class="analysis-title">${title}</div>

    <div class="analysis-summary">
      <div class="analysis-stat">
        <span>Tổng tồn</span>
        <b>${formatNumber(total)}</b>
      </div>

      <div class="analysis-stat">
        <span>Số line</span>
        <b>${formatNumber(lineCount)}</b>
      </div>

      <div class="analysis-stat">
        <span>Huyện</span>
        <b>${huyen.length}</b>
      </div>

      <div class="analysis-stat">
        <span>Nhân viên</span>
        <b>${nv.length}</b>
      </div>
    </div>

    <div class="analysis-section">
      <b>📊 Cơ cấu tồn</b>
      <div class="analysis-list">
        ${analysisTypeCard("TK","Hàng triển khai",typeStats.tk,total)}
        ${analysisTypeCard("TH","Hàng thu hồi",typeStats.th,total)}
        ${analysisTypeCard("UCTT","Hàng UCTT",typeStats.uctt,total)}
      </div>
    </div>
  `;

  if(topHuyen.length){

    html += `
      <div class="analysis-section">
        <b>📍 Top huyện tồn</b>
        <div class="analysis-list">
          ${topHuyen.map((x,i) => `
            <div class="analysis-row">
              <span>${i+1}. ${escapeHtml(x.name || "Chưa xác định")}</span>
              <strong>${formatNumber(x.total)}</strong>
            </div>
          `).join("")}
        </div>
      </div>
    `;

  }

  if(topNV.length){

    html += `
      <div class="analysis-section">
        <b>👤 Top nhân viên tồn</b>
        <div class="analysis-list">
          ${topNV.map((x,i) => `
            <div class="analysis-row">
              <span>${i+1}. ${escapeHtml(x.name || "Chưa xác định")}</span>
              <strong>${formatNumber(x.total)}</strong>
            </div>
          `).join("")}
        </div>
      </div>
    `;

  }

  html += buildAnalysisAssessment(
    data,
    total,
    typeStats,
    topHuyen,
    topNV
  );

  html += `
    <div class="analysis-hint">
      💡 Nhập <b>${escapeHtml(keyword)} line</b> để xem toàn bộ tồn line.
      Có thể thêm <b>TK</b>, <b>TH</b> hoặc <b>UCTT</b> để phân tích riêng từng loại.
    </div>
  `;

  result.innerHTML = html;
}


function isTypeForAnalysis(item,type){

  const loai = normalizeText(item.loaimh);

  if(type === "tk") return loai.includes("trien khai");
  if(type === "th") return loai.includes("thu hoi");
  if(type === "uctt") return loai.includes("uctt");

  return false;
}


function typeName(type){

  return {
    tk:"Hàng triển khai",
    th:"Hàng thu hồi",
    uctt:"Hàng UCTT"
  }[type] || type;
}


function summarizeRows(rows){

  return {
    total: rows.reduce(
      (sum,item) => sum + Number(item.sl || 0),0
    ),
    lines: rows.length
  };

}


function aggregateBy(data,field){

  const map = new Map();

  data.forEach(item => {

    const name = String(item[field] || "").trim() || "Chưa xác định";
    const value = Number(item.sl || 0);

    if(!map.has(name)){
      map.set(name,{
        name:name,
        total:0,
        lines:0
      });
    }

    const obj = map.get(name);
    obj.total += value;
    obj.lines += 1;

  });

  return [...map.values()]
    .sort((a,b) => b.total - a.total);

}


function formatNumber(value){

  return Number(value || 0).toLocaleString("vi-VN");

}


function percentage(value,total){

  if(!total) return "0.0%";

  return ((value / total) * 100).toFixed(1) + "%";

}


function analysisTypeCard(code,name,stats,total){

  return `
    <div class="analysis-type-card">
      <div>
        <strong>${code}</strong>
        <small>${name}</small>
      </div>

      <div class="analysis-type-number">
        ${formatNumber(stats.total)}
        <small>${stats.lines} line · ${percentage(stats.total,total)}</small>
      </div>
    </div>
  `;

}


function buildAnalysisAssessment(
  data,
  total,
  typeStats,
  topHuyen,
  topNV
){

  const messages = [];

  if(!total){
    return "";
  }

  /* Cơ cấu loại hàng — luôn ghi rõ số lượng */
  if(typeStats.tk.total > 0){

    const p = typeStats.tk.total / total;

    messages.push(
      `TK (Hàng triển khai) đang tồn <b>${formatNumber(typeStats.tk.total)}</b> bộ, <b>${typeStats.tk.lines}</b> line, chiếm <b>${percentage(typeStats.tk.total,total)}</b> tổng tồn.`
    );

  }

  if(typeStats.th.total > 0){

    const p = typeStats.th.total / total;

    messages.push(
      `TH (Hàng thu hồi) đang tồn <b>${formatNumber(typeStats.th.total)}</b> bộ, <b>${typeStats.th.lines}</b> line, chiếm <b>${percentage(typeStats.th.total,total)}</b> tổng tồn${p >= .3 ? "; tỷ trọng TH khá cao, nên ưu tiên rà soát thu hồi/xử lý." : "."}`
    );

  }else{

    messages.push(
      `TH (Hàng thu hồi): <b>0</b> bộ, <b>0</b> line.`
    );

  }

  if(typeStats.uctt.total > 0){

    const p = typeStats.uctt.total / total;

    messages.push(
      `UCTT đang tồn <b>${formatNumber(typeStats.uctt.total)}</b> bộ, <b>${typeStats.uctt.lines}</b> line, chiếm <b>${percentage(typeStats.uctt.total,total)}</b> tổng tồn${p >= .3 ? "; tỷ trọng đáng kể, cần theo dõi riêng." : "."}`
    );

  }

  /* Tập trung theo huyện — luôn ghi số lượng của huyện đứng đầu */
  if(topHuyen.length && total > 0){

    const p = topHuyen[0].total / total;

    messages.push(
      `Huyện tồn nhiều nhất là <b>${escapeHtml(topHuyen[0].name)}</b>: <b>${formatNumber(topHuyen[0].total)}</b> bộ / <b>${topHuyen[0].lines}</b> line, chiếm <b>${percentage(topHuyen[0].total,total)}</b>${p >= .4 ? " — mức tập trung cao." : "."}`
    );

  }

  /* Tập trung theo nhân viên — luôn ghi số lượng */
  if(topNV.length && total > 0){

    const p = topNV[0].total / total;

    messages.push(
      `Nhân viên tồn nhiều nhất là <b>${escapeHtml(topNV[0].name)}</b>: <b>${formatNumber(topNV[0].total)}</b> bộ / <b>${topNV[0].lines}</b> line, chiếm <b>${percentage(topNV[0].total,total)}</b>${p >= .25 ? " — mức tập trung cao." : "."}`
    );

  }

  if(!messages.length){

    messages.push(
      `Tổng tồn <b>${formatNumber(total)}</b> bộ trên <b>${data.length}</b> line; chưa phát hiện điểm tập trung quá cao theo các tiêu chí hiện có.`
    );

  }

  return `
    <div class="analysis-section">
      <b>🧠 Đánh giá</b>
      <div class="analysis-assessment">
        ${messages.map(x => `<div>• ${x}</div>`).join("")}
      </div>
    </div>
  `;

}
