  {"key":"tkmq10h","label":"TKM quá 10h","class":"warn"},
  {"key":"tkmq16h","label":"TKM quá 16h","class":"warn"},
  {"key":"tkmq24h","label":"TKM quá 24h","class":"hot"},
  {"key":"tkmqhen","label":"TKM quá hẹn","class":"hot"}
];
const PRIMARY=["account","congviec","nhanvien"], SECONDARY=["nhanvien","huyen"], INFO_KEYS=["account","congviec","dichvu","tttichhen","duongday","tongtgtkm","ngaydaunoi","ngaykethuc","tongthen","huyen","thoigiantichhen","tongtghen","tgtinhhen"];
const state={page:1,limit:50,q:"",columns:[],data:[],total:0,totalPages:1,searchTimer:null};
const $=id=>document.getElementById(id), norm=v=>String(v??"").trim();
const low=v=>norm(v).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");
function columnFor(needle){
  const n=low(needle);
  return state.columns.find(c=>{
    const key=low(c.key);
    const raw=low(c.raw);
    const label=low(c.label);
    return key===n || raw===n || label===n;
  });
}
function keyFor(needle){const c=columnFor(needle);return c?c.key:"";}
function val(row,needle){const k=keyFor(needle);return k?norm(row[k]):"";}
function vnLabel(col){
  const exact=LABELS[low(col.key)] || LABELS[low(col.raw)] || LABELS[low(col.label)];
  return exact || col.label || col.raw || col.key;
}
function isActive(v){
  const x=low(v);
  return !!x && !["-","0","false","khong","chua","không"].includes(x);
}
function rowStatuses(row){
  return STATUS_DEFS.map(s=>({...s,value:val(row,s.key)})).filter(s=>isActive(s.value));
}
function summaryStatuses(row){
  return rowStatuses(row).map(function(s){
    const value = norm(s.value);
    return {
      label: value && !["1","x","true"].includes(low(value))
        ? value
        : s.label,
      className: s.class
    };
  });
}
function firstValue(row, keys){
  for(const k of keys){const v=val(row,k);if(v)return v;}
  return "";
}
function titleOf(row){return firstValue(row,PRIMARY)||"Bản ghi";}
function subOf(row){
  const out=[]; for(const k of SECONDARY){const v=val(row,k);if(v)out.push(v);}
  return out.join(" · ") || "QH TKM";
}
function initials(row){
  const text=titleOf(row)||"?"; return text.split(/\s+/).filter(Boolean).slice(-1)[0].slice(0,1).toUpperCase();
}
function infoFields(row){
  const out=[];
  for(const k of INFO_KEYS){
    const v=val(row,k); if(v) out.push([LABELS[low(k)]||k,v]);
  }
  return out;
}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function hidePageLoader(){
  const loader=$("pageLoader");
  if(loader) loader.classList.add("hide");
  document.body.classList.remove("page-loading");
  document.body.classList.add("page-ready");
}
async function load(){
  $("list").innerHTML='<div class="loading">Đang tải dữ liệu...</div>'; $("statusLine").textContent="Đang kết nối dữ liệu...";
  const url=API+"&page="+state.page+"&limit="+state.limit+"&q="+encodeURIComponent(state.q)+"&_="+Date.now();
  try{
    const res=await fetch(url); if(!res.ok)throw new Error("HTTP "+res.status);
    const json=await res.json(); if(!json.success)throw new Error(json.error||"API trả về lỗi");
    state.columns=Array.isArray(json.columns)?json.columns:[]; state.data=Array.isArray(json.data)?json.data:[];
    state.total=Number(json.total||0);state.totalPages=Number(json.totalPages||1);state.page=Number(json.page||1);
    render();$("statusLine").textContent=new Intl.NumberFormat("vi-VN").format(state.total)+" bản ghi";
    hidePageLoader();
  }catch(err){
    $("list").innerHTML='<div class="error"><b>Không tải được dữ liệu.</b><br><br>'+escapeHtml(err.message)+'</div>';
    $("statusLine").textContent="Lỗi tải dữ liệu";$("pagination").innerHTML="";
    hidePageLoader();
  }
}
function renderStats(){
  const rows=state.data, flagged=rows.filter(r=>rowStatuses(r).length>0).length;
  $("stTotal").textContent=new Intl.NumberFormat("vi-VN").format(state.total);
  $("stDone").textContent=new Intl.NumberFormat("vi-VN").format(flagged);
}
function render(){
  renderStats();$("resultTitle").textContent=state.q?'Kết quả: “'+state.q+'”':"DANH SÁCH QUÁ HẠN TKM";
  if(!state.data.length){$("list").innerHTML='<div class="empty">Không tìm thấy dữ liệu phù hợp.</div>';renderPagination();return;}
  $("list").innerHTML=state.data.map((row,i)=>{
    const fields=infoFields(row), summaries=summaryStatuses(row);
    return `<article class="card">
      <div class="card-top"><div class="avatar">${escapeHtml(initials(row))}</div><div><div class="main-title">${escapeHtml(titleOf(row))}</div><div class="main-sub">${escapeHtml(subOf(row))}</div></div><div class="chev">›</div></div>
      <div class="info-grid">${fields.map(f=>`<div class="info"><div class="k">${escapeHtml(f[0])}</div><div class="v">${escapeHtml(f[1])}</div></div>`).join("")}</div>
      <div class="card-bottom"><div class="tags">
        ${summaries.length
          ? summaries.map(function(s){
              return `<span class="tag ${s.className}">${escapeHtml(s.label)}</span>`;
            }).join("")
          : '<span class="tag neutral">Không có cảnh báo quá hạn</span>'}
      </div><button class="detail-btn" data-index="${i}">Chi tiết</button></div>
    </article>`;
  }).join("");
  document.querySelectorAll(".detail-btn").forEach(b=>b.addEventListener("click",()=>openDetail(Number(b.dataset.index))));
  renderPagination();
}
function renderPagination(){
  const p=state.page,t=state.totalPages;
  $("pagination").innerHTML=`<button class="page-btn" id="prev" ${p<=1?"disabled":""}>‹</button><span class="page-info">Trang ${p} / ${t}</span><button class="page-btn" id="next" ${p>=t?"disabled":""}>›</button>`;
  $("prev").onclick=()=>{if(state.page>1){state.page--;load()}};$("next").onclick=()=>{if(state.page<t){state.page++;load()}};
}
function openDetail(index){
  const row=state.data[index];$("modalTitle").textContent=titleOf(row);
  $("detailGrid").innerHTML=state.columns.map(c=>`<div class="detail"><div class="k">${escapeHtml(vnLabel(c))}</div><div class="v">${escapeHtml(norm(row[c.key])||"-")}</div></div>`).join("");
  $("modal").classList.add("show");
}
function closeModal(){$("modal").classList.remove("show")}
$("closeModal").onclick=closeModal;$("modal").addEventListener("click",e=>{if(e.target===$("modal"))closeModal()});
$("searchBtn").onclick=()=>{state.q=$("searchInput").value.trim();state.page=1;load()};
$("searchInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("searchBtn").click()});
$("searchInput").addEventListener("input",()=>{clearTimeout(state.searchTimer);state.searchTimer=setTimeout(()=>{state.q=$("searchInput").value.trim();state.page=1;load()},700)});
$("limitSelect").addEventListener("change",()=>{state.limit=Number($("limitSelect").value);state.page=1;load()});
load();
</script></body></html>
