<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff">
<title>Danh sách cài đặt</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#202124;--muted:#777b83;--line:#e5e6e9;--red:#d71920;--redsoft:#fff0f1;--green:#178a45;--greensoft:#eaf8f0;--orange:#c77a08;--orangesoft:#fff5e4}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;min-height:100vh;padding-bottom:30px}.header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px 12px}.headrow,.summary{display:flex;align-items:center;gap:10px}.headrow{justify-content:space-between}.title{font-size:25px;font-weight:800}.area{font-size:22px;font-weight:800;color:var(--red)}.search{display:flex;align-items:center;gap:8px;margin-top:13px;padding:0 10px;background:#fff;border:1px solid var(--line);border-radius:16px}.search span{font-size:23px;color:#666}.search input{width:100%;border:0;outline:0;padding:14px 4px;font-size:17px}.filtericon{width:40px;height:40px;border:0;background:transparent;color:#666;font-size:22px}.summary{margin-top:12px}.filterbutton{border:1px solid #dec8ca;background:#fff;border-radius:12px;padding:10px 14px;font-weight:700;color:#555}.total{margin-left:auto;color:var(--red);font-size:20px;font-weight:800}.content{padding:14px 16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.label{font-size:12px;color:var(--muted);font-weight:700}.value{font-size:23px;font-weight:800;margin-top:5px}.red{color:var(--red)}.green{color:var(--green)}.orange{color:var(--orange)}.status{display:none;padding:10px;border-radius:10px;margin-bottom:10px;font-size:13px}.status.show{display:block}.error{background:#fff0f0;color:#b00020}.loading{background:#f1f4f8;color:#555}.list{display:flex;flex-direction:column;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.top{display:flex;gap:12px;align-items:flex-start}.avatar{width:48px;height:48px;flex:0 0 48px;border-radius:13px;background:var(--redsoft);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}.main{min-width:0;flex:1}.name{font-size:18px;font-weight:800;line-height:1.25;word-break:break-word}.sub{font-size:13px;color:var(--muted);margin-top:4px}.arrow{font-size:26px;color:#777}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.info{background:#fafafa;border-radius:10px;padding:8px 10px}.ivalue{font-size:13px;font-weight:600;word-break:break-word;margin-top:3px}.bottom{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{padding:7px 9px;border-radius:10px;font-size:12px;font-weight:700}.badge.green{background:var(--greensoft)}.badge.orange{background:var(--orangesoft)}.badge.gray{background:#f0f1f3;color:#666}.detail{margin-left:auto;border:0;background:transparent;color:var(--red);font-weight:800}.empty{background:#fff;border:1px dashed #d5d7db;border-radius:14px;padding:30px;text-align:center;color:#777}.pages{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:16px}.pagebtn{min-width:42px;height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:800}.pagebtn:disabled{opacity:.4}.pageinfo{min-width:100px;text-align:center;font-weight:800}.updated{text-align:center;color:#92959b;font-size:11px;margin-top:10px}.modalbg,.filterbg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:flex-end;justify-content:center}.modalbg.show,.filterbg.show{display:flex}.modal,.filterbox{width:min(680px,100%);background:#fff;border-radius:20px 20px 0 0;padding:18px;max-height:88vh;overflow:auto}.modalhead,.filterhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modaltitle,.filtertitle{font-size:20px;font-weight:800}.close{width:38px;height:38px;border:0;border-radius:50%;background:#f0f1f3;font-size:20px}.detailrow{display:grid;grid-template-columns:145px 1fr;gap:12px;border-bottom:1px solid #eee;padding:11px 0}.detailrow:last-child{border:0}.dlabel{font-size:12px;color:var(--muted);font-weight:700}.dvalue{font-size:14px;word-break:break-word}.select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:10px}.actions{display:flex;gap:8px}.actions button{flex:1;padding:11px;border:0;border-radius:11px;font-weight:800}.reset{background:#f0f1f3;color:#555}.apply{background:var(--red);color:#fff}@media(max-width:600px){.title{font-size:23px}.area{font-size:20px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}}@media(max-width:390px){.title{font-size:21px}.grid{grid-template-columns:1fr}.total{font-size:18px}.detailrow{grid-template-columns:120px 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="header">
<div class="headrow"><div class="title">DANH SÁCH CÀI ĐẶT</div><div class="area">GLI</div></div>
<div class="search"><span>⌕</span><input id="searchInput" type="search" placeholder="Account, mã nhân viên, họ tên, huyện..." autocomplete="off"><button class="filtericon" id="openFilter">☷</button></div>
<div class="summary"><button class="filterbutton">⚠ Đã cài</button><div class="total" id="totalText">0 bản ghi</div></div>
</header>
<main class="content">
<section class="stats"><div class="stat"><div class="label">Tổng</div><div class="value red" id="statTotal">0</div></div><div class="stat"><div class="label">Đã cài</div><div class="value green" id="statInstalled">0</div></div><div class="stat"><div class="label">Chưa cài</div><div class="value orange" id="statNotInstalled">0</div></div></section>
<div id="status" class="status"></div><section id="list" class="list"></section>
<div class="pages"><button class="pagebtn" id="prevBtn">‹</button><div class="pageinfo" id="pageInfo">Trang 1/1</div><button class="pagebtn" id="nextBtn">›</button></div><div class="updated" id="updated"></div>
</main></div>
<div class="modalbg" id="detailModal"><div class="modal"><div class="modalhead"><div class="modaltitle">Chi tiết cài đặt</div><button class="close" id="closeDetail">×</button></div><div id="detailContent"></div></div></div>
<div class="filterbg" id="filterPanel"><div class="filterbox"><div class="filterhead"><div class="filtertitle">Bộ lọc</div><button class="close" id="closeFilter">×</button></div><select class="select" id="huyenFilter"><option value="">Tất cả huyện</option></select><div class="actions"><button class="reset" id="resetFilter">Xóa lọc</button><button class="apply" id="applyFilter">Áp dụng</button></div></div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbxyL8pyy5_Hz_ehabGQM4c0fwrytudPE-JkHm1zpn-CT9-br-JOS7krTfCGtZJf7n8u/exec";
const PAGE_SIZE=20;
const HUYEN=[
  {value:"Cụm kỹ thuật Chư Prông - Đức Cơ",label:"Chư Prông"},
  {value:"Cụm kỹ thuật Hoài Nhơn - Hoài Ân - An Lão",label:"Bồng Sơn"},
  {value:"Cụm kỹ thuật Huyện An Khê - Kông Chro - Đăk Pơ",label:"An Khê"},
  {value:"Cụm kỹ thuật Huyện AyunPa-Ia-pa -Phú Thiện -Krông Pa",label:"AyunPa"},
  {value:"Cụm kỹ thuật Huyện Chư Sê - Chư Pưh",label:"Chư Sê"},
  {value:"Cụm kỹ thuật Huyện Đăk Đoa - Mang Yang",label:"Đăk Đoa"},
  {value:"Cụm kỹ thuật Phù Cát - Phù Mỹ",label:"Phù Cát"},
  {value:"Cụm kỹ thuật Tây Sơn - Vĩnh Thạnh",label:"Tây Sơn"},
  {value:"Cụm kỹ thuật TP Pleiku - Chư Păh",label:"Hội Phú"},
  {value:"Cụm kỹ thuật Tuy Phước - Vân Canh - An Nhơn",label:"Tuy Phước"},
  {value:"Ia Grai",label:"Ia Grai"},
  {value:"Kbang",label:"Kbang"},
  {value:"Quy Nhơn",label:"Quy Nhơn"}
];
let page=1,totalPages=1,search="",huyen="",data=[];
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function installed(v){return ["1","true","đã cài","da cai","yes","y"].includes(String(v??"").trim().toLowerCase())}
function url(){const u=new URL(API_URL);u.searchParams.set("page",page);u.searchParams.set("pageSize",PAGE_SIZE);if(search)u.searchParams.set("search",search);if(huyen)u.searchParams.set("huyen",huyen);return u}
function status(t,c="loading"){$("status").textContent=t;$('status').className="status show "+c}
function hideStatus(){$("status").className="status"}
async function load(){status("Đang tải dữ liệu...");try{const r=await fetch(url(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const j=await r.json();if(!j.success)throw Error(j.error||"API lỗi");data=Array.isArray(j.data)?j.data:[];totalPages=Math.max(Number(j.totalPages||1),1);renderStats(Number(j.total||0));render();pagination(j);hideStatus();$('updated').textContent="Cập nhật: "+new Date().toLocaleString("vi-VN")}catch(e){console.error(e);status("Không tải được dữ liệu: "+e.message,"error");$('list').innerHTML='<div class="empty">Kiểm tra URL Apps Script và quyền Web App.</div>'}}
function renderStats(total){const yes=data.filter(x=>installed(x["Đã cài"])).length;$('statTotal').textContent=total.toLocaleString("vi-VN");$('statInstalled').textContent=yes.toLocaleString("vi-VN");$('statNotInstalled').textContent=Math.max(data.length-yes,0).toLocaleString("vi-VN");$('totalText').textContent=total.toLocaleString("vi-VN")+" bản ghi"}
function render(){if(!data.length){$('list').innerHTML='<div class="empty">Không có dữ liệu phù hợp.</div>';return}$('list').innerHTML=data.map((x,i)=>{const ok=installed(x["Đã cài"]),name=x["Họ tên"]||x["Mã nhân viên"]||"Chưa xác định";return `<article class="card"><div class="top"><div class="avatar">${esc(name.trim()[0]||"N")}</div><div class="main"><div class="name">${esc(name)}</div><div class="sub">${esc(x["Mã nhân viên"]||"-")} • ${esc(x["Huyện"]||"-")}</div></div><div class="arrow">›</div></div><div class="grid"><div class="info"><div class="label">ACCOUNT</div><div class="ivalue">${esc(x["Account"]||"-")}</div></div><div class="info"><div class="label">TÁC VỤ</div><div class="ivalue">${esc(x["Tác vụ"]||"-")}</div></div><div class="info"><div class="label">NGƯỜI CÀI</div><div class="ivalue">${esc(x["Người cài"]||"-")}</div></div><div class="info"><div class="label">THỜI GIAN CÀI</div><div class="ivalue">${esc(x["Thời gian cài"]||"-")}</div></div></div><div class="bottom"><span class="badge ${ok?"green":"orange"}">${ok?"✓ Đã cài":"○ Chưa cài"}</span><span class="badge gray">Đóng TV: ${esc(x["Thời gian đóng TV"]||"-")}</span><button class="detail" onclick="detail(${i})">Xem chi tiết</button></div></article>`}).join("")}
function pagination(j){page=Number(j.page||page);totalPages=Math.max(Number(j.totalPages||1),1);$('pageInfo').textContent=`Trang ${page}/${totalPages}`;$('prevBtn').disabled=!j.hasPreviousPage;$('nextBtn').disabled=!j.hasNextPage}
function fillHuyen(){
  $('huyenFilter').innerHTML='<option value="">Tất cả huyện</option>'+HUYEN.map(item=>`<option value="${esc(item.value)}">${esc(item.label)}</option>`).join("");
  $('huyenFilter').value=huyen;
}
function detail(i){const x=data[i];if(!x)return;const f=[["Huyện",x["Huyện"]],["Account",x["Account"]],["Đã cài",x["Đã cài"]],["Người cài",x["Người cài"]],["Thời gian cài",x["Thời gian cài"]],["Mã nhân viên",x["Mã nhân viên"]],["Họ tên",x["Họ tên"]],["Tác vụ",x["Tác vụ"]],["Thời gian đóng TV",x["Thời gian đóng TV"]]];$('detailContent').innerHTML=f.map(([a,b])=>`<div class="detailrow"><div class="dlabel">${esc(a)}</div><div class="dvalue">${esc(b||"-")}</div></div>`).join("");$('detailModal').classList.add("show")}
function closeDetail(){$('detailModal').classList.remove("show")}
function openFilter(){fillHuyen();$('filterPanel').classList.add("show")}
function closeFilter(){$('filterPanel').classList.remove("show")}
$('searchInput').addEventListener('input',e=>{clearTimeout(window.searchTimer);window.searchTimer=setTimeout(()=>{search=e.target.value.trim();page=1;load()},350)});
$('prevBtn').onclick=()=>{if(page>1){page--;load();scrollTo({top:0,behavior:'smooth'})}};
$('nextBtn').onclick=()=>{if(page<totalPages){page++;load();scrollTo({top:0,behavior:'smooth'})}};
$('openFilter').onclick=openFilter;$('closeFilter').onclick=closeFilter;$('closeDetail').onclick=closeDetail;
$('resetFilter').onclick=()=>{huyen="";page=1;closeFilter();load()};
$('applyFilter').onclick=()=>{huyen=$('huyenFilter').value;page=1;closeFilter();load()};
$('filterPanel').onclick=e=>{if(e.target===$('filterPanel'))closeFilter()};$('detailModal').onclick=e=>{if(e.target===$('detailModal'))closeDetail()};
window.onkeydown=e=>{if(e.key==='Escape'){closeFilter();closeDetail()}};
fillHuyen();load();
</script>
</body>
</html>
