<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Danh sách cài đặt</title>

<style>
:root{
  --bg:#f5f6f8;
  --card:#ffffff;
  --text:#202124;
  --muted:#777b83;
  --line:#e5e6e9;
  --primary:#d71920;
  --primary-soft:#fff0f1;
  --success:#178a45;
  --success-soft:#eaf8f0;
  --warning:#c77a08;
  --warning-soft:#fff5e4;
  --shadow:0 2px 10px rgba(0,0,0,.06);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}

.app{max-width:1100px;margin:0 auto;min-height:100vh;padding-bottom:28px}

.header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:14px 16px 12px;
}

.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.title{font-size:25px;font-weight:800;letter-spacing:-.4px}
.area{font-size:22px;font-weight:800;color:var(--primary)}

.search-wrap{
  display:flex;align-items:center;gap:8px;
  margin-top:13px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:0 12px;
  box-shadow:0 1px 4px rgba(0,0,0,.03);
}
.search-icon{font-size:22px;color:#666;flex:0 0 auto}
#searchInput{
  width:100%;border:0;outline:0;background:transparent;
  padding:14px 4px;font-size:17px;color:var(--text);
}
#searchInput::placeholder{color:#777}

.icon-btn{
  border:0;background:transparent;color:#666;
  width:40px;height:40px;border-radius:12px;font-size:22px;
}
.icon-btn:active{background:#f0f1f3}

.summary{display:flex;align-items:center;gap:10px;margin-top:12px}
.filter-btn{
  border:1px solid #dec8ca;background:#fff;border-radius:12px;
  padding:10px 14px;font-weight:700;color:#555;display:flex;align-items:center;gap:8px;
}
.filter-btn.active{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.total{margin-left:auto;font-size:20px;font-weight:800;color:var(--primary);white-space:nowrap}

.content{padding:14px 16px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}
.stat-label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase}
.stat-value{font-size:23px;font-weight:800;margin-top:5px}
.stat-value.success{color:var(--success)}
.stat-value.primary{color:var(--primary)}
.stat-value.warning{color:var(--warning)}

.status{display:none;margin-bottom:10px;padding:10px 12px;border-radius:10px;font-size:13px}
.status.show{display:block}
.status.error{background:#fff0f0;color:#b00020;border:1px solid #f0caca}
.status.loading{background:#f1f4f8;color:#555}

.list{display:flex;flex-direction:column;gap:10px}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:15px;box-shadow:var(--shadow);
}
.card-top{display:flex;align-items:flex-start;gap:12px}
.avatar{
  width:48px;height:48px;border-radius:13px;background:var(--primary-soft);
  color:var(--primary);display:flex;align-items:center;justify-content:center;
  flex:0 0 48px;font-size:23px;font-weight:800;
}
.card-main{min-width:0;flex:1}
.card-name{font-size:18px;font-weight:800;line-height:1.25;word-break:break-word}
.card-sub{font-size:13px;color:var(--muted);margin-top:4px;word-break:break-word}
.arrow{font-size:26px;color:#6d7075;line-height:1;padding-top:2px}

.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}
.info{background:#fafafa;border-radius:10px;padding:8px 10px;min-width:0}
.info-label{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px}
.info-value{font-size:13px;font-weight:600;word-break:break-word}

.card-bottom{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:10px;padding:7px 9px;font-size:12px;font-weight:700}
.badge.success{background:var(--success-soft);color:var(--success)}
.badge.warning{background:var(--warning-soft);color:var(--warning)}
.badge.neutral{background:#f0f1f3;color:#666}
.detail-btn{margin-left:auto;border:0;background:transparent;color:var(--primary);font-weight:800;padding:7px 2px}

.empty{background:#fff;border:1px dashed #d5d7db;border-radius:14px;padding:30px 15px;text-align:center;color:#777}
.empty-icon{font-size:34px;margin-bottom:8px}

.pagination{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px}
.page-btn{border:1px solid var(--line);background:#fff;border-radius:10px;min-width:42px;height:40px;font-weight:800;color:#555}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.page-info{font-size:14px;font-weight:800;min-width:110px;text-align:center}

.footer-time{text-align:center;color:#92959b;font-size:11px;margin-top:10px}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-backdrop.show{display:flex}
.modal{width:min(680px,100%);max-height:88vh;background:#fff;border-radius:20px 20px 0 0;overflow:auto;padding:18px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.modal-title{font-size:20px;font-weight:800}
.close{border:0;background:#f0f1f3;width:38px;height:38px;border-radius:50%;font-size:20px}
.detail-row{display:grid;grid-template-columns:145px 1fr;gap:12px;border-bottom:1px solid #eee;padding:11px 0}
.detail-row:last-child{border-bottom:0}
.detail-label{font-size:12px;color:var(--muted);font-weight:700}
.detail-value{font-size:14px;word-break:break-word}

.filter-panel{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;display:none;align-items:flex-end;justify-content:center}
.filter-panel.show{display:flex}
.filter-box{width:min(600px,100%);background:#fff;border-radius:20px 20px 0 0;padding:18px}
.filter-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.filter-title{font-size:19px;font-weight:800}
.select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:10px}
.filter-actions{display:flex;gap:8px;margin-top:8px}
.filter-actions button{flex:1;padding:11px;border-radius:11px;border:0;font-weight:800}
.reset{background:#f0f1f3;color:#555}.apply{background:var(--primary);color:#fff}

@media(max-width:600px){
  .app{max-width:none}
  .header{padding:12px 16px 11px}
  .title{font-size:24px}
  .area{font-size:20px}
  .content{padding:12px 16px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat:last-child{grid-column:1/-1}
  .card{padding:14px}
  .card-grid{grid-template-columns:1fr 1fr}
  .detail-row{grid-template-columns:120px 1fr}
}

@media(max-width:390px){
  .title{font-size:21px}.area{font-size:18px}
  .card-grid{grid-template-columns:1fr}
  .total{font-size:18px}
}
</style>
</head>

<body>
<div class="app">

  <header class="header">
    <div class="header-row">
      <div class="title">DANH SÁCH CÀI ĐẶT</div>
      <div class="area">GLI</div>
    </div>

    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input id="searchInput" type="search" autocomplete="off" placeholder="Account, mã nhân viên, họ tên, huyện...">
      <button class="icon-btn" id="openFilter" title="Bộ lọc">☷</button>
    </div>

    <div class="summary">
      <button class="filter-btn" id="overdueBtn">⚠ <span>Đã cài</span></button>
      <div class="total" id="totalText">0 bản ghi</div>
    </div>
  </header>

  <main class="content">
    <section class="stats">
      <div class="stat">
        <div class="stat-label">Tổng</div>
        <div class="stat-value primary" id="statTotal">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Đã cài</div>
        <div class="stat-value success" id="statInstalled">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Chưa cài</div>
        <div class="stat-value warning" id="statNotInstalled">0</div>
      </div>
    </section>

    <div id="status" class="status"></div>
    <section id="list" class="list"></section>

    <div class="pagination">
      <button class="page-btn" id="prevBtn">‹</button>
      <div class="page-info" id="pageInfo">Trang 1/1</div>
      <button class="page-btn" id="nextBtn">›</button>
    </div>

    <div class="footer-time" id="footerTime"></div>
  </main>
</div>

<!-- DETAIL MODAL -->
<div class="modal-backdrop" id="detailModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title">Chi tiết cài đặt</div>
      <button class="close" id="closeDetail">×</button>
    </div>
    <div id="detailContent"></div>
  </div>
</div>

<!-- FILTER PANEL -->
<div class="filter-panel" id="filterPanel">
  <div class="filter-box">
    <div class="filter-head">
      <div class="filter-title">Bộ lọc</div>
      <button class="close" id="closeFilter">×</button>
    </div>

    <select class="select" id="huyenFilter">
      <option value="">Tất cả huyện</option>
    </select>

    <select class="select" id="taskFilter">
      <option value="">Tất cả tác vụ</option>
    </select>

    <div class="filter-actions">
      <button class="reset" id="resetFilter">Xóa lọc</button>
      <button class="apply" id="applyFilter">Áp dụng</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   CẤU HÌNH API
   ============================================================
   Dán URL Web App Apps Script của bạn vào đây.

   Ví dụ:
   const API_URL = "https://script.google.com/macros/s/XXXXX/exec";
   ============================================================ */
const API_URL = "DAN_URL_APPS_SCRIPT_VAO_DAY";

const PAGE_SIZE = 20;

let currentPage = 1;
let totalPages = 1;
let currentSearch = "";
let currentHuyen = "";
let currentTask = "";
let currentData = [];

const $ = id => document.getElementById(id);

function esc(value){
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function isInstalled(value){
  const text = String(value ?? "").trim().toLowerCase();
  return ["1","true","đã cài","da cai","yes","y"].includes(text);
}

function showStatus(message, type="loading"){
  const el = $("status");
  el.textContent = message;
  el.className = `status show ${type}`;
}

function hideStatus(){
  $("status").className = "status";
}

function buildUrl(){
  const url = new URL(API_URL);
  url.searchParams.set("page", currentPage);
  url.searchParams.set("pageSize", PAGE_SIZE);
  if(currentSearch) url.searchParams.set("search", currentSearch);
  if(currentHuyen) url.searchParams.set("huyen", currentHuyen);
  if(currentTask) url.searchParams.set("task", currentTask);
  return url.toString();
}

async function loadData(){
  if(!API_URL || API_URL.includes("DAN_URL_APPS_SCRIPT")){
    showStatus("Chưa cấu hình URL Apps Script API.", "error");
    renderEmpty("Dán URL API Apps Script vào biến API_URL ở cuối file caidat.html.");
    return;
  }

  showStatus("Đang tải dữ liệu...", "loading");

  try{
    const response = await fetch(buildUrl(), {cache:"no-store"});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);

    const json = await response.json();
    if(!json.success) throw new Error(json.error || "API trả về lỗi");

    currentData = Array.isArray(json.data) ? json.data : [];
    totalPages = Math.max(Number(json.totalPages || 1), 1);

    renderStats(json.total || 0);
    renderList(currentData);
    updatePagination(json);
    hideStatus();

    $("footerTime").textContent = "Cập nhật: " + new Date().toLocaleString("vi-VN");

    if(currentPage === 1 && !currentSearch && !currentHuyen && !currentTask){
      buildFilterOptions(currentData);
    }
  }catch(error){
    console.error(error);
    showStatus("Không tải được dữ liệu: " + error.message, "error");
    renderEmpty("Kiểm tra URL Apps Script, quyền Web App và kết nối mạng.");
  }
}

function renderStats(total){
  const installed = currentData.filter(x => isInstalled(x["Đã cài"])).length;
  const notInstalled = Math.max(currentData.length - installed, 0);

  $("statTotal").textContent = Number(total).toLocaleString("vi-VN");
  $("statInstalled").textContent = installed.toLocaleString("vi-VN");
  $("statNotInstalled").textContent = notInstalled.toLocaleString("vi-VN");
  $("totalText").textContent = Number(total).toLocaleString("vi-VN") + " bản ghi";
}

function renderList(data){
  const list = $("list");

  if(!data.length){
    renderEmpty("Không có dữ liệu phù hợp.");
    return;
  }

  list.innerHTML = data.map((item, index) => {
    const installed = isInstalled(item["Đã cài"]);
    const name = item["Họ tên"] || item["Mã nhân viên"] || "Chưa xác định";
    const account = item["Account"] || "-";
    const huyen = item["Huyện"] || "-";
    const task = item["Tác vụ"] || "-";
    const worker = item["Người cài"] || "-";
    const installTime = item["Thời gian cài"] || "-";
    const closeTime = item["Thời gian đóng TV"] || "-";
    const code = item["Mã nhân viên"] || "-";

    return `
      <article class="card">
        <div class="card-top">
          <div class="avatar">${esc((name.trim()[0] || "N").toUpperCase())}</div>
          <div class="card-main">
            <div class="card-name">${esc(name)}</div>
            <div class="card-sub">${esc(code)} • ${esc(huyen)}</div>
          </div>
          <div class="arrow">›</div>
        </div>

        <div class="card-grid">
          <div class="info">
            <div class="info-label">ACCOUNT</div>
            <div class="info-value">${esc(account)}</div>
          </div>
          <div class="info">
            <div class="info-label">TÁC VỤ</div>
            <div class="info-value">${esc(task)}</div>
          </div>
          <div class="info">
            <div class="info-label">NGƯỜI CÀI</div>
            <div class="info-value">${esc(worker)}</div>
          </div>
          <div class="info">
            <div class="info-label">THỜI GIAN CÀI</div>
            <div class="info-value">${esc(installTime)}</div>
          </div>
        </div>

        <div class="card-bottom">
          <span class="badge ${installed ? "success" : "warning"}">
            ${installed ? "✓ Đã cài" : "○ Chưa cài"}
          </span>
          <span class="badge neutral">Đóng TV: ${esc(closeTime)}</span>
          <button class="detail-btn" onclick="openDetail(${index})">Xem chi tiết</button>
        </div>
      </article>
    `;
  }).join("");
}

function renderEmpty(message){
  $("list").innerHTML = `
    <div class="empty">
      <div class="empty-icon">⌕</div>
      <div>${esc(message)}</div>
    </div>
  `;
}

function updatePagination(json){
  currentPage = Number(json.page || currentPage);
  totalPages = Math.max(Number(json.totalPages || 1), 1);

  $("pageInfo").textContent = `Trang ${currentPage}/${totalPages}`;
  $("prevBtn").disabled = !json.hasPreviousPage;
  $("nextBtn").disabled = !json.hasNextPage;
}

function buildFilterOptions(data){
  const huyenSet = new Set();
  const taskSet = new Set();

  data.forEach(item => {
    if(item["Huyện"]) huyenSet.add(String(item["Huyện"]));
    if(item["Tác vụ"]) taskSet.add(String(item["Tác vụ"]));
  });

  const huyenSelect = $("huyenFilter");
  const taskSelect = $("taskFilter");

  huyenSelect.innerHTML = `<option value="">Tất cả huyện</option>` +
    [...huyenSet].sort().map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join("");

  taskSelect.innerHTML = `<option value="">Tất cả tác vụ</option>` +
    [...taskSet].sort().map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join("");

  huyenSelect.value = currentHuyen;
  taskSelect.value = currentTask;
}

function openDetail(index){
  const item = currentData[index];
  if(!item) return;

  const fields = [
    ["Huyện", item["Huyện"]],
    ["Account", item["Account"]],
    ["Đã cài", item["Đã cài"]],
    ["Người cài", item["Người cài"]],
    ["Thời gian cài", item["Thời gian cài"]],
    ["Mã nhân viên", item["Mã nhân viên"]],
    ["Họ tên", item["Họ tên"]],
    ["Tác vụ", item["Tác vụ"]],
    ["Thời gian đóng TV", item["Thời gian đóng TV"]]
  ];

  $("detailContent").innerHTML = fields.map(([label,value]) => `
    <div class="detail-row">
      <div class="detail-label">${esc(label)}</div>
      <div class="detail-value">${esc(value || "-")}</div>
    </div>
  `).join("");

  $("detailModal").classList.add("show");
}

function closeDetail(){
  $("detailModal").classList.remove("show");
}

function openFilters(){
  $("huyenFilter").value = currentHuyen;
  $("taskFilter").value = currentTask;
  $("filterPanel").classList.add("show");
}

function closeFilters(){
  $("filterPanel").classList.remove("show");
}

function resetFilters(){
  currentHuyen = "";
  currentTask = "";
  $("huyenFilter").value = "";
  $("taskFilter").value = "";
  closeFilters();
  currentPage = 1;
  loadData();
}

function applyFilters(){
  currentHuyen = $("huyenFilter").value;
  currentTask = $("taskFilter").value;
  closeFilters();
  currentPage = 1;
  loadData();
}

let searchTimer;
$("searchInput").addEventListener("input", event => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    currentSearch = event.target.value.trim();
    currentPage = 1;
    loadData();
  }, 350);
});

$("prevBtn").addEventListener("click", () => {
  if(currentPage > 1){
    currentPage--;
    loadData();
    window.scrollTo({top:0,behavior:"smooth"});
  }
});

$("nextBtn").addEventListener("click", () => {
  if(currentPage < totalPages){
    currentPage++;
    loadData();
    window.scrollTo({top:0,behavior:"smooth"});
  }
});

$("openFilter").addEventListener("click", openFilters);
$("closeFilter").addEventListener("click", closeFilters);
$("resetFilter").addEventListener("click", resetFilters);
$("applyFilter").addEventListener("click", applyFilters);
$("closeDetail").addEventListener("click", closeDetail);

$("detailModal").addEventListener("click", e => {
  if(e.target === $("detailModal")) closeDetail();
});

$("filterPanel").addEventListener("click", e => {
  if(e.target === $("filterPanel")) closeFilters();
});

window.addEventListener("keydown", e => {
  if(e.key === "Escape"){
    closeDetail();
    closeFilters();
  }
});

loadData();
</script>
</body>
</html>
