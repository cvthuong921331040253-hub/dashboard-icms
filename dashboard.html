<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff">
<title>Dashboard cài đặt</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#202124;--muted:#777b83;--line:#e5e6e9;--red:#d71920}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.app{max-width:1100px;margin:auto;min-height:100vh}.header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px}.head{display:flex;align-items:center;gap:12px}.back{border:0;background:#f0f1f3;border-radius:10px;width:40px;height:40px;font-size:22px}.title{font-size:23px;font-weight:800}.area{margin-left:auto;color:var(--red);font-size:20px;font-weight:800}.content{padding:18px 16px}.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.box h2{margin:0 0 8px;font-size:20px}.box p{margin:0;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="head"><button class="back" onclick="history.back()" aria-label="Quay lại">‹</button><div class="title">DASHBOARD</div><div class="area">GLI</div></div></header>
<main class="content"><section class="box"><h2>Dashboard cài đặt</h2><p>Khu vực này đã được tạo sẵn. Các thông số, biểu đồ và nội dung Dashboard sẽ được bổ sung theo yêu cầu tiếp theo.</p></section></main>
</div>
</body>
</html>
