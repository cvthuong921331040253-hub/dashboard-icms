<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">
<title>Dashboard Tâmmi - Gia Lai</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#202124;--muted:#70757d;--line:#e1e3e7;--red:#e9002b;--blue:#3f789b;--green:#3d907f;--gold:#a37d20}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}body{min-width:0}.app{max-width:1250px;margin:auto;padding:18px}.top{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px}.back{border:0;background:#f0f1f3;border-radius:9px;width:40px;height:40px;font-size:24px}.title{flex:1;text-align:center;color:var(--red);font-size:23px;font-weight:900}.area{color:var(--red);font-weight:900;font-size:19px}.date{margin-top:10px;background:#fff;border:2px solid var(--red);border-radius:10px;padding:10px;text-align:center;color:var(--red);font-size:20px;font-weight:900}.loading{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px;text-align:center;color:#666}.hide{display:none}.section,.warning{margin-top:16px;background:var(--red);color:#fff;border-radius:8px;padding:10px 14px;font-size:17px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:9px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.head{color:#fff;text-align:center;padding:9px;font-weight:900}.gold .head{background:var(--gold)}.blue .head{background:var(--blue)}.green .head{background:var(--green)}.red .head{background:var(--red)}.row{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.cell{padding:8px 4px;border-right:1px solid var(--line)}.cell:last-child{border-right:0}.label{font-size:11px;font-weight:700}.num{font-size:17px;font-weight:900;margin-top:5px}.sub{border-top:1px solid var(--line)}.controls{display:flex;justify-content:flex-end;margin:8px 0}.controls select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}.wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{border:1px solid #e0e2e6;padding:7px 6px;text-align:center;font-weight:700;font-size:13px}.table th{background:#f1eeee}.table th:first-child,.table td:first-child{text-align:left}.table tbody tr:nth-child(even){background:#fff6f7}.low{background:var(--red)!important;color:#fff!important;border-radius:5px}.mobile-list{display:none}.mcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}.mname{font-size:15px;font-weight:900;margin-bottom:8px}.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mitem{background:#f7f7f8;border-radius:7px;padding:7px}.mlabel{font-size:10px;color:var(--muted);font-weight:700}.mvalue{font-size:14px;font-weight:900;margin-top:3px}.mvalue.lowtxt{color:var(--red)}.footer{text-align:center;color:var(--red);font-size:11px;font-weight:700;margin-top:14px;border-top:1px dashed #ddd;padding-top:9px}
@media(max-width:900px){.app{padding:12px}.cards{grid-template-columns:1fr 1fr}.title{font-size:19px}}
@media(max-width:600px){.app{padding:8px}.top{padding:8px 9px}.back{width:36px;height:36px;font-size:21px}.title{font-size:16px}.area{font-size:16px}.date{font-size:13px;padding:8px}.section,.warning{font-size:14px;padding:9px 11px;margin-top:12px}.cards{grid-template-columns:1fr 1fr;gap:6px}.head{font-size:13px;padding:8px 3px}.label{font-size:9px}.num{font-size:15px;margin-top:4px}.cell{padding:6px 2px}.controls{margin:6px 0}.controls select{width:100%;font-size:13px}.wrap{display:none}.mobile-list{display:block}.footer{font-size:9px}.loading{font-size:12px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><button class="back" onclick="location.href='tammi.html'">‹</button><div class="title">DASHBOARD BÁO CÁO CÀI ĐẶT TAMMI</div><div class="area">GLI</div></div>
<div class="date" id="dateTitle">GIA LAI - BÁO CÁO KẾT QUẢ CÀI ĐẶT TAMMI</div>
<div class="loading" id="loading">Đang tải dữ liệu...</div>
<div class="section">▥ TỔNG QUAN TOÀN TỈNH</div>
<div class="cards" id="kpis"></div>
<div class="warning">⚠ CẢNH BÁO: CÁC CỤM/HUYỆN CÓ TỶ LỆ CÀI ĐẶT THẤP NHẤT</div>
<div class="controls"><select id="limit"><option value="10">Top 10</option><option value="13">Tất cả 13 huyện</option></select></div>
<div class="wrap"><table class="table" id="district"></table></div><div class="mobile-list" id="districtMobile"></div>
<div class="warning">⚠ CẢNH BÁO: CÁC FT CÓ TỶ LỆ CÀI ĐẶT THẤP NHẤT</div>
<div class="wrap"><table class="table" id="employee"></table></div><div class="mobile-list" id="employeeMobile"></div>
<div class="footer">Số liệu ngày sử dụng N-1 • Lũy kế tính đến N-1 • Google Sheets / Apps Script</div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbxyL8pyy5_Hz_ehabGQM4c0fwrytudPE-JkHm1zpn-CT9-br-JOS7krTfCGtZJf7n8u/exec';
const PAGE=100;
const HUYEN=[['Cụm kỹ thuật Chư Prông - Đức Cơ','Chư Prông'],['Cụm kỹ thuật Hoài Nhơn - Hoài Ân - An Lão','Bồng Sơn'],['Cụm kỹ thuật Huyện An Khê - Kông Chro - Đăk Pơ','An Khê'],['Cụm kỹ thuật Huyện AyunPa-Ia-pa -Phú Thiện -Krông Pa','AyunPa'],['Cụm kỹ thuật Huyện Chư Sê - Chư Pưh','Chư Sê'],['Cụm kỹ thuật Huyện Đăk Đoa - Mang Yang','Đăk Đoa'],['Cụm kỹ thuật Phù Cát - Phù Mỹ','Phù Cát'],['Cụm kỹ thuật Tây Sơn - Vĩnh Thạnh','Tây Sơn'],['Cụm kỹ thuật TP Pleiku - Chư Păh','Hội Phú'],['Cụm kỹ thuật Tuy Phước - Vân Canh - An Nhơn','Tuy Phước'],['Ia Grai','Ia Grai'],['Kbang','Kbang'],['Quy Nhơn','Quy Nhơn']];
const $=x=>document.getElementById(x),fmt=n=>Number(n||0).toLocaleString('vi-VN'),norm=x=>String(x??'').trim().toLowerCase();
const pct=(a,b)=>b?((a/b)*100).toLocaleString('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2})+'%':'0,00%';
const installed=x=>['1','true','đã cài','da cai','yes','y'].includes(norm(x));
function date(s){s=String(s||'').trim();if(!s)return null;let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);let d=new Date(s);return isNaN(d)?null:d}
function dayKey(d){return d?`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`:''}function sameDay(d,t){return d&&dayKey(d)===dayKey(t)}function sameMonth(d,t){return d&&d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()}
function woDate(x){return date(x['Thời gian đóng WO']||x['Thời gian đóng TV']||x['ngay_ht'])}function installDate(x){return date(x['Thời gian cài']||x['thoi_gian_cai_dat_tammi'])}
function taskType(x){const t=norm(x['task_type_name']||x['Tác vụ']);return t.includes('xử lý sự cố')?'SC':'TKM'}
function calc(rs,t,mode){let w=0,c=0;for(const x of rs){const wd=woDate(x),id=installDate(x);if(mode==='day'?sameDay(wd,t):sameMonth(wd,t))w++;if(installed(x['Đã cài']||x['trang_thai_cai_dat_tammi'])&&(mode==='day'?sameDay(id,t):sameMonth(id,t)))c++}return{w,c}}
async function page(p){const u=new URL(API);u.searchParams.set('page',p);u.searchParams.set('pageSize',PAGE);const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!j.success)throw Error(j.error||'API lỗi');return j}
async function all(){const first=await page(1),out=[...(first.data||[])],pages=Number(first.totalPages||1);for(let p=2;p<=pages;p+=8){const q=[];for(let i=p;i<Math.min(p+8,pages+1);i++)q.push(page(i));(await Promise.all(q)).forEach(j=>out.push(...(j.data||[])))}return out}
function kpi(title,cls,d,m){return `<div class="card ${cls}"><div class="head">${title}</div><div class="row"><div class="cell"><div class="label">WO</div><div class="num">${fmt(d.w)}</div></div><div class="cell"><div class="label">WO cài</div><div class="num">${fmt(d.c)}</div></div><div class="cell"><div class="label">Tỷ lệ</div><div class="num">${pct(d.c,d.w)}</div></div></div><div class="row sub"><div class="cell"><div class="label">Lũy kế WO</div><div class="num">${fmt(m.w)}</div></div><div class="cell"><div class="label">Lũy kế cài</div><div class="num">${fmt(m.c)}</div></div><div class="cell"><div class="label">Tỷ lệ LK</div><div class="num">${pct(m.c,m.w)}</div></div></div></div>`}
function renderKpi(rs,t){const d=calc(rs,t,'day'),m=calc(rs,t,'month'),td=calc(rs.filter(x=>taskType(x)==='TKM'),t,'day'),tm=calc(rs.filter(x=>taskType(x)==='TKM'),t,'month'),sd=calc(rs.filter(x=>taskType(x)==='SC'),t,'day'),sm=calc(rs.filter(x=>taskType(x)==='SC'),t,'month');$('kpis').innerHTML=kpi('Chỉ tiêu cài đặt','gold',d,m)+kpi('TKM','blue',td,tm)+kpi('SC','green',sd,sm)+kpi('Lũy kế tháng','red',d,m)}
function districtRows(rs,t){return HUYEN.map(([v,l])=>{const x=rs.filter(r=>norm(r['Huyện'])===norm(v));return{l,d:calc(x,t,'day'),m:calc(x,t,'month')}}).sort((a,b)=>(a.m.c/Math.max(a.m.w,1))-(b.m.c/Math.max(b.m.w,1)))}
function low(v){return v&&v<.2?'low':''}
function renderDistrict(rs,t){const rows=districtRows(rs,t).slice(0,+$('limit').value);$('district').innerHTML=`<thead><tr><th rowspan="2">Cụm/Huyện</th><th colspan="3">NGÀY N-1</th><th colspan="3">LŨY KẾ ĐẾN N-1</th></tr><tr><th>WO</th><th>WO cài</th><th>Tỷ lệ</th><th>WO</th><th>WO cài</th><th>Tỷ lệ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.l}</td><td>${fmt(r.d.w)}</td><td>${fmt(r.d.c)}</td><td class="${low(r.d.w&&r.d.c/r.d.w)}">${pct(r.d.c,r.d.w)}</td><td>${fmt(r.m.w)}</td><td>${fmt(r.m.c)}</td><td class="${low(r.m.w&&r.m.c/r.m.w)}">${pct(r.m.c,r.m.w)}</td></tr>`).join('')}</tbody>`;$('districtMobile').innerHTML=rows.map(r=>`<div class="mcard"><div class="mname">${r.l}</div><div class="mgrid"><div class="mitem"><div class="mlabel">NGÀY N-1 • WO</div><div class="mvalue">${fmt(r.d.w)}</div></div><div class="mitem"><div class="mlabel">NGÀY N-1 • CÀI</div><div class="mvalue">${fmt(r.d.c)}</div></div><div class="mitem"><div class="mlabel">NGÀY N-1 • TỶ LỆ</div><div class="mvalue ${r.d.w&&r.d.c/r.d.w<.2?'lowtxt':''}">${pct(r.d.c,r.d.w)}</div></div><div class="mitem"><div class="mlabel">LŨY KẾ • WO / CÀI</div><div class="mvalue">${fmt(r.m.w)} / ${fmt(r.m.c)}</div></div><div class="mitem"><div class="mlabel">LŨY KẾ • TỶ LỆ</div><div class="mvalue ${r.m.w&&r.m.c/r.m.w<.2?'lowtxt':''}">${pct(r.m.c,r.m.w)}</div></div></div></div>`).join('')}
function employeeRows(rs,t){const map=new Map();for(const x of rs){const name=x['Họ tên']||x['Mã nhân viên']||'-',code=x['Mã nhân viên']||'',k=code+'|'+name;if(!map.has(k))map.set(k,{name,code,rs:[]});map.get(k).rs.push(x)}return [...map.values()].map(e=>({...e,d:calc(e.rs,t,'day'),m:calc(e.rs,t,'month')})).filter(e=>e.m.w>0).sort((a,b)=>(a.m.c/Math.max(a.m.w,1))-(b.m.c/Math.max(b.m.w,1))).slice(0,10)}
function renderEmployee(rs,t){const rows=employeeRows(rs,t);$('employee').innerHTML=`<thead><tr><th rowspan="2">Mã NV</th><th rowspan="2">Họ tên NV</th><th colspan="3">NGÀY N-1</th><th colspan="3">LŨY KẾ ĐẾN N-1</th></tr><tr><th>WO</th><th>WO cài</th><th>Tỷ lệ</th><th>WO</th><th>WO cài</th><th>Tỷ lệ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.code||'-'}</td><td>${r.name}</td><td>${fmt(r.d.w)}</td><td>${fmt(r.d.c)}</td><td class="${low(r.d.w&&r.d.c/r.d.w)}">${pct(r.d.c,r.d.w)}</td><td>${fmt(r.m.w)}</td><td>${fmt(r.m.c)}</td><td class="${low(r.m.w&&r.m.c/r.m.w)}">${pct(r.m.c,r.m.w)}</td></tr>`).join('')}</tbody>`;$('employeeMobile').innerHTML=rows.map(r=>`<div class="mcard"><div class="mname">${r.name} <span style="font-size:11px;color:#777">(${r.code||'-'})</span></div><div class="mgrid"><div class="mitem"><div class="mlabel">NGÀY N-1 • WO / CÀI</div><div class="mvalue">${fmt(r.d.w)} / ${fmt(r.d.c)}</div></div><div class="mitem"><div class="mlabel">NGÀY N-1 • TỶ LỆ</div><div class="mvalue ${r.d.w&&r.d.c/r.d.w<.2?'lowtxt':''}">${pct(r.d.c,r.d.w)}</div></div><div class="mitem"><div class="mlabel">LŨY KẾ • WO / CÀI</div><div class="mvalue">${fmt(r.m.w)} / ${fmt(r.m.c)}</div></div><div class="mitem"><div class="mlabel">LŨY KẾ • TỶ LỆ</div><div class="mvalue ${r.m.w&&r.m.c/r.m.w<.2?'lowtxt':''}">${pct(r.m.c,r.m.w)}</div></div></div></div>`).join('')}
let records=[];async function run(){try{$('loading').textContent='Đang tải dữ liệu...';records=await all();const t=new Date();t.setDate(t.getDate()-1);$('dateTitle').textContent=`GIA LAI - BÁO CÁO KẾT QUẢ CÀI ĐẶT TAMMI LŨY KẾ THÁNG ĐẾN NGÀY ${String(t.getDate()).padStart(2,'0')}/${String(t.getMonth()+1).padStart(2,'0')}/${t.getFullYear()}`;renderKpi(records,t);renderDistrict(records,t);renderEmployee(records,t);$('loading').classList.add('hide')}catch(e){$('loading').textContent='Không tải được dữ liệu: '+e.message;console.error(e)}}
$('limit').onchange=()=>{if(records.length){const t=new Date();t.setDate(t.getDate()-1);renderDistrict(records,t)}};run();
</script>
</body>
</html>
