<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard Tâmmi - Gia Lai</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#202124;--muted:#70757d;--line:#e1e3e7;--red:#e9002b;--blue:#3f789b;--green:#3d907f;--gold:#a37d20}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.app{max-width:1250px;margin:auto;padding:20px}.top{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 18px;display:flex;align-items:center;gap:12px}.back{border:0;background:#f0f1f3;border-radius:10px;width:40px;height:40px;font-size:24px;cursor:pointer}.title{flex:1;text-align:center;color:var(--red);font-size:24px;font-weight:900}.area{color:var(--red);font-weight:900;font-size:20px}.date{margin-top:10px;background:#fff;border:2px solid var(--red);border-radius:10px;padding:11px;text-align:center;color:var(--red);font-weight:900;font-size:21px}.loading{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;color:#666}.hide{display:none}.section{margin-top:18px;background:var(--red);color:#fff;border-radius:8px;padding:10px 15px;font-size:18px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.card{background:#fff;border:2px solid var(--line);border-radius:10px;overflow:hidden}.head{color:#fff;text-align:center;padding:10px;font-weight:900}.gold .head{background:var(--gold)}.blue .head{background:var(--blue)}.green .head{background:var(--green)}.red .head{background:var(--red)}.row{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.cell{padding:9px 5px;border-right:1px solid var(--line)}.cell:last-child{border-right:0}.label{font-size:12px;font-weight:700}.num{font-size:18px;font-weight:900;margin-top:7px}.sub{border-top:1px solid var(--line)}.warning{margin-top:18px;background:var(--red);color:#fff;border-radius:8px;padding:10px 15px;font-size:17px;font-weight:900}.controls{display:flex;justify-content:flex-end;margin-top:9px}.controls select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}.wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;margin-top:9px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{border:1px solid #e0e2e6;padding:8px 7px;text-align:center;font-weight:700}.table th{background:#f1eeee}.table th:first-child,.table td:first-child{text-align:left}.table tbody tr:nth-child(even){background:#fff6f7}.low{background:var(--red)!important;color:#fff!important;border-radius:5px}.footer{text-align:center;color:var(--red);font-size:11px;font-weight:700;margin-top:15px;border-top:1px dashed #ddd;padding-top:10px}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.title{font-size:20px}}@media(max-width:600px){.app{padding:10px}.cards{grid-template-columns:1fr}.title{font-size:17px}.date{font-size:14px}.section,.warning{font-size:15px}}
</style>
</head>
<body>
<div class="app"><div class="top"><button class="back" onclick="location.href='tammi.html'">‹</button><div class="title">DASHBOARD BÁO CÁO CÀI ĐẶT TAMMI</div><div class="area">GLI</div></div><div class="date" id="dateTitle">GIA LAI - BÁO CÁO KẾT QUẢ CÀI ĐẶT TAMMI</div><div class="loading" id="loading">Đang tổng hợp số liệu...</div><div class="section">▥ TỔNG QUAN TOÀN TỈNH</div><div class="cards" id="kpis"></div><div class="warning">⚠ CẢNH BÁO: CÁC CỤM/HUYỆN CÓ TỶ LỆ CÀI ĐẶT THẤP NHẤT</div><div class="controls"><select id="limit"><option value="10">Top 10</option><option value="13">Tất cả 13 huyện</option></select></div><div class="wrap"><table class="table" id="district"></table></div><div class="warning">⚠ CẢNH BÁO: CÁC FT CÓ TỶ LỆ CÀI ĐẶT THẤP NHẤT</div><div class="wrap"><table class="table" id="employee"></table></div><div class="footer">Số liệu tổng hợp trực tiếp từ Google Sheets • Dashboard Tâmmi - Gia Lai</div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbxyL8pyy5_Hz_ehabGQM4c0fwrytudPE-JkHm1zpn-CT9-br-JOS7krTfCGtZJf7n8u/exec';const PAGE=100;const HUYEN=[['Cụm kỹ thuật Chư Prông - Đức Cơ','Chư Prông'],['Cụm kỹ thuật Hoài Nhơn - Hoài Ân - An Lão','Bồng Sơn'],['Cụm kỹ thuật Huyện An Khê - Kông Chro - Đăk Pơ','An Khê'],['Cụm kỹ thuật Huyện AyunPa-Ia-pa -Phú Thiện -Krông Pa','AyunPa'],['Cụm kỹ thuật Huyện Chư Sê - Chư Pưh','Chư Sê'],['Cụm kỹ thuật Huyện Đăk Đoa - Mang Yang','Đăk Đoa'],['Cụm kỹ thuật Phù Cát - Phù Mỹ','Phù Cát'],['Cụm kỹ thuật Tây Sơn - Vĩnh Thạnh','Tây Sơn'],['Cụm kỹ thuật TP Pleiku - Chư Păh','Hội Phú'],['Cụm kỹ thuật Tuy Phước - Vân Canh - An Nhơn','Tuy Phước'],['Ia Grai','Ia Grai'],['Kbang','Kbang'],['Quy Nhơn','Quy Nhơn']];const $=x=>document.getElementById(x),fmt=n=>Number(n||0).toLocaleString('vi-VN'),norm=x=>String(x??'').trim().toLowerCase(),pct=(a,b)=>b?((a/b)*100).toLocaleString('vi-VN',{minimumFractionDigits:2,maximumFractionDigits:2})+'%':'0,00%',installed=x=>['1','true','đã cài','da cai','yes','y'].includes(norm(x));
function date(s){s=String(s||'').trim();if(!s)return null;let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/);if(m)return new Date(+m[3],+m[2]-1,+m[1]);m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);let d=new Date(s);return isNaN(d)?null:d}function dayKey(d){return d?`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`:''}function sameDay(d,t){return d&&dayKey(d)===dayKey(t)}function sameMonth(d,t){return d&&d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()}
function woDate(x){return date(x['Thời gian đóng WO']||x['Thời gian đóng TV']||x['ngay_ht'])}function installDate(x){return date(x['Thời gian cài']||x['thoi_gian_cai_dat_tammi'])}function type(x){let t=norm(x['Tác vụ']||x['task_type_name']);if(t.includes('ptm'))return'PTM';if(t.includes('xlsc'))return'XLSC';return'OTHER'}
function calc(rs,t,mode){let w=0,c=0;for(const x of rs){let wd=woDate(x),id=installDate(x);if(mode==='day'?sameDay(wd,t):sameMonth(wd,t))w++;if(installed(x['Đã cài']||x['trang_thai_cai_dat_tammi'])&&(mode==='day'?sameDay(id,t):sameMonth(id,t)))c++}return{w,c}}
async function page(p){let u=new URL(API);u.searchParams.set('page',p);u.searchParams.set('pageSize',PAGE);let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();if(!j.success)throw Error(j.error||'API lỗi');return j}async function all(){let a=await page(1),out=[...(a.data||[])],pages=Number(a.totalPages||1);for(let p=2;p<=pages;p+=6){let q=[];for(let i=p;i<Math.min(p+6,pages+1);i++)q.push(page(i));(await Promise.all(q)).forEach(j=>out.push(...(j.data||[])))}return out}function latestDate(rs){let d=null;for(const x of rs){let a=woDate(x);if(a&&(!d||a>d))d=a}return d||new Date()}
function kpi(title,cls,d,m){return `<div class="card ${cls}"><div class="head">${title}</div><div class="row"><div class="cell"><div class="label">Wo</div><div class="num">${fmt(d.w)}</div></div><div class="cell"><div class="label">Wo cài</div><div class="num">${fmt(d.c)}</div></div><div class="cell"><div class="label">Tỷ lệ</div><div class="num">${pct(d.c,d.w)}</div></div></div><div class="row sub"><div class="cell"><div class="label">Lũy kế WO</div><div class="num">${fmt(m.w)}</div></div><div class="cell"><div class="label">Lũy kế cài</div><div class="num">${fmt(m.c)}</div></div><div class="cell"><div class="label">Tỷ lệ LK</div><div class="num">${pct(m.c,m.w)}</div></div></div></div>`}
function renderKpi(rs,t){let d=calc(rs,t,'day'),m=calc(rs,t,'month'),pd=calc(rs.filter(x=>type(x)==='PTM'),t,'day'),pm=calc(rs.filter(x=>type(x)==='PTM'),t,'month'),xd=calc(rs.filter(x=>type(x)==='XLSC'),t,'day'),xm=calc(rs.filter(x=>type(x)==='XLSC'),t,'month');$('kpis').innerHTML=kpi('Chỉ tiêu cài đặt','gold',d,m)+kpi('PTM','blue',pd,pm)+kpi('XLSC','green',xd,xm)+kpi('Lũy kế tháng','red',d,m)}
function districtRows(rs,t){return HUYEN.map(([v,l])=>{let x=rs.filter(r=>norm(r['Huyện'])===norm(v));return{l,d:calc(x,t,'day'),m:calc(x,t,'month')}}).sort((a,b)=>(a.m.c/Math.max(a.m.w,1))-(b.m.c/Math.max(b.m.w,1)))}function renderDistrict(rs,t){let rows=districtRows(rs,t).slice(0,+$('limit').value);$('district').innerHTML=`<thead><tr><th rowspan="2">Cụm/Huyện</th><th colspan="3">TRONG NGÀY</th><th colspan="3">LŨY KẾ THÁNG</th></tr><tr><th>Wo</th><th>Wo cài</th><th>Tỷ lệ</th><th>Wo</th><th>Wo cài</th><th>Tỷ lệ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.l}</td><td>${fmt(r.d.w)}</td><td>${fmt(r.d.c)}</td><td class="${r.d.w&&r.d.c/r.d.w<.2?'low':''}">${pct(r.d.c,r.d.w)}</td><td>${fmt(r.m.w)}</td><td>${fmt(r.m.c)}</td><td class="${r.m.w&&r.m.c/r.m.w<.2?'low':''}">${pct(r.m.c,r.m.w)}</td></tr>`).join('')}</tbody>`}
function employeeRows(rs,t){let map=new Map();for(const x of rs){let name=x['Họ tên']||x['Mã nhân viên']||'-',code=x['Mã nhân viên']||'',k=code+'|'+name;if(!map.has(k))map.set(k,{name,code,rs:[]});map.get(k).rs.push(x)}return [...map.values()].map(e=>({...e,d:calc(e.rs,t,'day'),m:calc(e.rs,t,'month')})).filter(e=>e.m.w>0).sort((a,b)=>(a.m.c/Math.max(a.m.w,1))-(b.m.c/Math.max(b.m.w,1))).slice(0,10)}function renderEmployee(rs,t){let rows=employeeRows(rs,t);$('employee').innerHTML=`<thead><tr><th rowspan="2">Mã NV</th><th rowspan="2">Họ tên NV</th><th colspan="3">TRONG NGÀY</th><th colspan="3">LŨY KẾ THÁNG</th></tr><tr><th>Wo</th><th>Wo cài</th><th>Tỷ lệ</th><th>Wo</th><th>Wo cài</th><th>Tỷ lệ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.code||'-'}</td><td>${r.name}</td><td>${fmt(r.d.w)}</td><td>${fmt(r.d.c)}</td><td class="${r.d.w&&r.d.c/r.d.w<.2?'low':''}">${pct(r.d.c,r.d.w)}</td><td>${fmt(r.m.w)}</td><td>${fmt(r.m.c)}</td><td class="${r.m.w&&r.m.c/r.m.w<.2?'low':''}">${pct(r.m.c,r.m.w)}</td></tr>`).join('')}</tbody>`}
let records=[];async function run(){try{$('loading').textContent='Đang tải dữ liệu...';records=await all();let t=latestDate(records);$('dateTitle').textContent=`GIA LAI - BÁO CÁO KẾT QUẢ CÀI ĐẶT TAMMI LŨY KẾ THÁNG ĐẾN NGÀY ${String(t.getDate()).padStart(2,'0')}/${String(t.getMonth()+1).padStart(2,'0')}/${t.getFullYear()}`;renderKpi(records,t);renderDistrict(records,t);renderEmployee(records,t);$('loading').classList.add('hide')}catch(e){$('loading').textContent='Không tải được dữ liệu: '+e.message}}$('limit').onchange=()=>{if(records.length)renderDistrict(records,latestDate(records))};run();
</script></body></html>
