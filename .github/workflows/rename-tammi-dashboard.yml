name: Rename Tâmmi Dashboard

on:
  push:
    paths:
      - '.github/workflows/rename-tammi-dashboard.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rename Dashboard and update link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git mv dashboard.html tammi-dashboard.html
          sed -i 's/DASHBOARD_URL="dashboard.html"/DASHBOARD_URL="tammi-dashboard.html"/g' tammi.html
          git add -A
          git commit -m "Đổi tên Dashboard Tâmmi thành tammi-dashboard.html"
          git push

      - name: Remove temporary workflow
        run: |
          rm -f .github/workflows/rename-tammi-dashboard.yml
          git add -A
          git commit -m "Xóa workflow đổi tên tạm thời"
          git push
