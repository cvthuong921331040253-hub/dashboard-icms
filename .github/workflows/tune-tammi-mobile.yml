name: Tune Tammi Mobile
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tune:
    if: ${{ !contains(github.event.head_commit.message, '[auto-tune]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase mobile sizing slightly
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tammi.html')
          s=p.read_text(encoding='utf-8')
          reps={
            '.title{font-size:17px}':'.title{font-size:18px}',
            '.area{font-size:16px}':'.area{font-size:17px}',
            '.search{height:38px':'.search{height:40px',
            '.search input{font-size:13px}':'.search input{font-size:14px}',
            '.total{font-size:11px}':'.total{font-size:12px}',
            '.content{padding:8px 10px}':'.content{padding:9px 10px}',
            '.stat{padding:8px;border-radius:9px}':'.stat{padding:9px;border-radius:10px}',
            '.label{font-size:9px}':'.label{font-size:10px}',
            '.value{font-size:16px;margin-top:3px}':'.value{font-size:17px;margin-top:3px}',
            '.stat-percent{font-size:9px;margin-top:2px}':'.stat-percent{font-size:10px;margin-top:2px}',
            '.dashboard-value{font-size:13px}':'.dashboard-value{font-size:14px}',
            '.card{padding:9px;border-radius:10px}':'.card{padding:10px;border-radius:11px}',
            '.list{gap:6px}':'.list{gap:7px}',
            '.avatar{width:34px;height:34px;flex-basis:34px;border-radius:9px;font-size:15px}':'.avatar{width:36px;height:36px;flex-basis:36px;border-radius:9px;font-size:16px}',
            '.top{gap:8px}':'.top{gap:9px}',
            '.name{font-size:13px}':'.name{font-size:14px}',
            '.sub{font-size:10px;margin-top:2px}':'.sub{font-size:11px;margin-top:2px}',
            '.arrow{font-size:19px}':'.arrow{font-size:20px}',
            '.grid{gap:4px;margin-top:7px}':'.grid{gap:5px;margin-top:8px}',
            '.info{padding:5px 6px;border-radius:7px}':'.info{padding:6px 7px;border-radius:8px}',
            '.ivalue{font-size:10px}':'.ivalue{font-size:11px}',
            '.badge{padding:4px 6px;font-size:9px}':'.badge{padding:5px 7px;font-size:10px}',
            '.detail{font-size:10px}':'.detail{font-size:11px}'
          }
          for a,b in reps.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tammi.html
          git diff --cached --quiet || git commit -m 'Tăng nhẹ kích thước mobile tammi [auto-tune]'
          git push
